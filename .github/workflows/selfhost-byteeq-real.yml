# selfhost-byteeq-real — REAL native-emit byte-eq on the ghost self-hosted runner.
#
# This is the B2 deliverable: run the byte-eq fixpoint + determinism gates for
# REAL (not exit-2-neutral) in CI, on the self-hosted runner `ghost-selfhost`
# which holds the graduated gen3 slot ($HX_HOME/self/native/selfhost/).
#
# FALLBACK-DISPATCH (tool/ci_pick_runner.sh via the `dispatch` job): when ghost
# is ONLINE + the event is same-repo we run REAL byte-eq on ghost; when ghost is
# OFFLINE (or a fork PR) we fall back to the free GitHub-hosted macos-15, where
# the gate runs in exit-2-NEUTRAL mode (no gen3 slot → byte-eq untestable, NOT
# broken) instead of sitting pending forever. The dispatch job also emits an
# `is_selfhosted` flag so the exit-2 ANNOTATION is correct on each: exit-2 is
# NEUTRAL (exit 0) on BOTH runners — untestable is never a FAIL — but on ghost
# it surfaces as a loud ::warning:: (the slot is supposed to be provisioned
# there; its absence is a runner-provisioning gap, not a PR regression —
# false-FAIL precedent: run 28668473232 redded unrelated PR #4492). Only a
# REAL divergence (exit-1: gen3≠gen4 / non-determinism) fails, on either runner.
#
# SAFETY: PATH-FILTERED (only compiler-relevant changes) and NOT a required
# status check. The required floor is the always-on ubuntu `selfhost-gates-summary`
# — this workflow stays best-effort-strong + deadlock-proof either way.
name: selfhost-byteeq-real

on:
  pull_request:
    paths:
      - 'self/**'
      - 'compiler/**'
      - 'tool/selfhost_byteeq_gate.sh'
      - 'tool/determinism_gate.sh'
      - 'tool/ci_pick_runner.sh'
      - '.github/actions/pick-runner/**'
      - '.github/workflows/selfhost-byteeq-real.yml'
      - 'tool/stage_resolve_runtime_a'
      - 'tool/release_build'
      - 'tool/stage_build_hexa'
      - 'tool/stage_prebuild_hexat'
  push:
    branches: [main]
    paths:
      - 'self/**'
      - 'compiler/**'
      - 'tool/selfhost_byteeq_gate.sh'
      - 'tool/determinism_gate.sh'
      - 'tool/ci_pick_runner.sh'
      - '.github/actions/pick-runner/**'
      - '.github/workflows/selfhost-byteeq-real.yml'
      - 'tool/stage_resolve_runtime_a'
      - 'tool/release_build'
      - 'tool/stage_build_hexa'
      - 'tool/stage_prebuild_hexat'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-byteeq-real-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # main push runs are NOT cancelled — supersede-cancel on the serial darwin runner left required-gate history holes (anima run 28651287277 precedent, 2026-07-03); PR runs still cancel-on-supersede like every sibling selfhost gate

jobs:
  # ── dispatch — fallback-dispatch runner picker (free · always available) ─────
  # Emits the darwin runs-on label (ghost when online + same-repo, else
  # macos-15) plus `is_selfhosted` so the byte-eq job remaps exit-2 correctly.
  dispatch:
    name: dispatch (pick runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      darwin_label: ${{ steps.darwin.outputs.label }}
      is_selfhosted: ${{ contains(steps.darwin.outputs.label, 'self-hosted') }}
    steps:
      - uses: actions/checkout@v6
      - id: darwin
        uses: ./.github/actions/pick-runner
        with:
          kind: darwin
          # slot-bound: the byte-eq/determinism legs need ghost's provisioned
          # gen3 slot — never spill to the insurance runner (false exit-2 RED).
          primary-only: '1'
          eligible: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          # administration:read PAT (self-hosted runners list needs it; the
          # default github.token CANNOT carry that scope → empty list → blind
          # fallback). Absent secret → `|| github.token` = today's harmless
          # macos-15 fallback; present → routing goes live. See PR/root-cause.
          token: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}

  byteeq-real:
    name: selfhost-byteeq-real
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.darwin_label) }}
    timeout-minutes: 90
    env:
      # 'true' on ghost (slot expected → exit-2 gets a loud ::warning::); 'false'
      # on the macos-15 fallback (no slot → exit-2 is the expected ::notice::).
      # Exit-2 is NEUTRAL on both — only exit-1 (real divergence) fails.
      IS_SELFHOSTED: ${{ needs.dispatch.outputs.is_selfhosted }}
    steps:
      - uses: actions/checkout@v6

      - name: byte-eq fixpoint — REAL (ghost gen3 slot) / NEUTRAL (cloud fallback)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          bash tool/selfhost_byteeq_gate.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            if [ "${IS_SELFHOSTED}" = "true" ]; then
              # Slot is supposed to be present on ghost — surface the provisioning
              # gap LOUDLY, but exit-2 means untestable NOT broken: never fail an
              # unrelated PR for runner state (false-FAIL precedent: run 28668473232).
              echo "::warning::byte-eq exit-2 on the slot runner (ghost) — gen3 slot missing at \$HX_HOME/self/native/selfhost. Runner provisioning gap: re-warm the ghost slot. NEUTRAL, not a byte-eq verdict."
              exit 0
            fi
            # GitHub-hosted fallback: no gen3 slot, byte-eq untestable NOT broken.
            echo "::notice::byte-eq exit-2 on GitHub-hosted fallback (no gen3 slot) → NEUTRAL"
            exit 0
          fi
          exit "$rc"

      - name: determinism — REAL (gen3 default path) / NEUTRAL (cloud fallback)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          bash tool/determinism_gate.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            if [ "${IS_SELFHOSTED}" = "true" ]; then
              echo "::warning::determinism exit-2 on the slot runner (ghost) — gen3 slot missing. Runner provisioning gap: re-warm the ghost slot. NEUTRAL, not a determinism verdict."
              exit 0
            fi
            echo "::notice::determinism exit-2 on GitHub-hosted fallback (no gen3 slot) → NEUTRAL"
            exit 0
          fi
          exit "$rc"
