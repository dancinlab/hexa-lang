name: autotag

# main push 마다 Conventional Commits 기준으로 다음 SemVer 태그를 자동 생성한다.
#   feat! / BREAKING CHANGE  → major  (vX+1.0.0)
#   feat:                    → minor  (vX.Y+1.0)
#   그 외 전부 (fix/docs/...) → patch  (vX.Y.Z+1)   ← 매 push 최소 1칸 보장
# install.hexa(최신 v* 태그 빌드)가 이 태그를 그대로 소비 → 누구나 동일 최신 빌드.
# GITHUB_TOKEN 으로 푸시한 태그는 다른 워크플로를 재트리거하지 않음(루프 방지).

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write   # `gh workflow run release.yml` (workflow_dispatch) on the new tag

concurrency:
  group: autotag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autotag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute + push next SemVer tag + trigger release.yml
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 최신 semver 태그 (없으면 v0.0.0 부터 시작).
          # `git for-each-ref --count=1` 로 최상위 1개를 직접 받는다 — 옛
          # `git tag --sort | head -1` 은 태그가 많아지면 head 가 파이프를 일찍
          # 닫아 git 에 SIGPIPE → `set -o pipefail` 아래 exit 141 로 스크립트가 첫
          # 줄에서 죽었다(태그 자동생성 전면 중단 근본원인). 파이프 자체를 제거.
          last="$(git for-each-ref --sort=-v:refname --format='%(refname:short)' --count=1 'refs/tags/v*')"
          [ -z "$last" ] && last="v0.0.0"
          base="${last#v}"
          IFS=. read -r MA MI PA <<<"$base"
          MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"

          # 마지막 태그 이후 커밋 메시지 수집 (태그가 실재할 때만 범위 한정).
          if git rev-parse -q --verify "refs/tags/${last}" >/dev/null 2>&1; then
            range="${last}..HEAD"
          else
            range="HEAD"
          fi
          msgs="$(git log --format='%s%x1f%b%x1e' "$range")"

          # ── DEBOUNCE (release-worthy gate · stable 빌드 횟수↓) ────────
          # 새 stable vX.Y.Z (+ 3-target 풀빌드) 는 last 태그 이후 범위에
          # release-worthy 커밋(feat/fix/perf 또는 BREAKING)이 있을 때만 만든다.
          # 순수 docs/chore/ci/style/test/refactor 머지는 출하 바이너리가
          # byte-identical 이므로 풀 3타깃 재빌드 + tag-storm 만 유발 → skip
          # (squash-merge 커밋 subject = PR 제목 = conventional type 으로 판정).
          # `test` 롤링 prerelease (release.yml 의 main-push 트리거) 는 여전히
          # 매 머지 발행되므로 실험 채널·`HEXA_VERSION=test` 소비자는 무영향.
          subjects="$(git log --format='%s' "$range")"
          if ! grep -qiE '^(feat|fix|perf)(\([^)]*\))?!?:' <<<"$subjects" \
             && ! grep -q 'BREAKING CHANGE' <<<"$msgs"; then
            echo "no release-worthy commit (feat/fix/perf/BREAKING) since ${last} — skip stable tag (docs/chore/ci-only). test prerelease still ships."
            exit 0
          fi

          # ── ATLAS-PATCH HOOK (hexa-lang) ─────────────────────────────
          # 기본 generic: 아래 줄은 no-op. hexa-lang 에서는 atlas builtin 추가가
          # 매우 잦으므로 minor 가 아니라 patch 로만 올린다 — feat(atlas)/atlas
          # register/embedded.gen.hexa 변경은 minor 판정에서 제외한다.
          ATLAS_PATCH_ONLY=1   # hexa-lang 에서만 1 로 켠다.

          bump=patch
          if grep -qE '[a-z]+(\([^)]*\))?!:' <<<"$msgs" || grep -q 'BREAKING CHANGE' <<<"$msgs"; then
            bump=major
          else
            feats="$(grep -oE 'feat(\([^)]*\))?:' <<<"$msgs" || true)"
            if [ "$ATLAS_PATCH_ONLY" = "1" ]; then
              # atlas 스코프 feat 는 제외하고 남은 feat 가 있을 때만 minor.
              feats="$(grep -vE 'feat\(atlas\)' <<<"$feats" || true)"
            fi
            [ -n "$feats" ] && bump=minor
          fi

          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            patch) PA=$((PA+1));;
          esac
          next="v${MA}.${MI}.${PA}"
          echo "last=$last bump=$bump next=$next"

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null 2>&1; then
            echo "tag ${next} already exists — skip"; exit 0
          fi
          git tag "$next" "${GITHUB_SHA}"
          git push origin "$next"

          # A GITHUB_TOKEN-pushed tag does NOT auto-trigger release.yml (push-event
          # recursion guard) — which left every autotag'd vX.Y.Z an orphan with no
          # published release, so stable Latest sat dormant at v0.262.0 while tags
          # climbed to v0.31x. workflow_dispatch IS exempt from that guard, so
          # explicitly dispatch release.yml on the just-created tag → 3-target build
          # → the `finalize` job promotes Latest ONLY on 3/3 green (all-green gate
          # intact: a failing target leaves the release as prerelease, never Latest).
          gh workflow run release.yml -f tag="$next" \
            && echo "dispatched release.yml for $next" \
            || echo "warn: release.yml dispatch failed for $next (tag still pushed)"
