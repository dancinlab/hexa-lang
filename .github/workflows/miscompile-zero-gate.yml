name: miscompile-zero-gate

# ── MISCOMPILE-ZERO regression gate ─────────────────────────────────────────
#
# PURPOSE
#   Keep the native self-hosted hexa codegen at MISCOMPILE-ZERO. The byte-eq
#   self-host graduation was won by fixing a CLASS of native-codegen
#   miscompiles, each surfacing as an `ENCODE-MISS` in the --emit=obj stderr or
#   a spurious `udf` instruction in the emitted Mach-O object:
#     - hex-literal 0xNN -> 0          (lower _parse_int, 47421c89c)
#     - .truncate(0) global aliasing   (953c8824b)
#     - _ends_with / string-compare cascade (downstream of hex)
#     - linker reloc gaps: literal8 / __DATA UNSIGNED / mod_init_func (#2509)
#
# WHAT IT DOES
#   1. Builds the native `./hexa` driver via the SAME shared release path the
#      release + nobaseline gate use (tool/release_build).
#   2. Runs tool/miscompile_zero_gate.sh, which native --emit=obj compiles a
#      tiny corpus (self/test/miscompile_zero/*.hexa) — one program per class —
#      and FAILS NONZERO on ANY ENCODE-MISS or spurious udf.
#
#   This is the LIGHTWEIGHT gate (seconds of emit, not the 68-min full
#   self-emit). It runs on macos-latest (arm64) so the arm64-apple-darwin
#   emit + `otool` disassembly path the graduation was proven on is exercised.
#
#   The proven reference run is on the ghost macOS host with the gen2_fix
#   native compiler; for that host the one-liner is:
#     HEXA_NATIVE_CC=~/dancinlab/selfhost-work/gen2_fix \
#       bash tool/miscompile_zero_gate.sh

on:
  push:
    branches: [main]
    paths:
      - 'self/test/miscompile_zero/**'
      - 'tool/miscompile_zero_gate.sh'
      - '.github/workflows/miscompile-zero-gate.yml'
      - 'tool/stage_resolve_runtime_a'
      - 'tool/release_build'
      - 'tool/stage_build_hexa'
      - 'tool/stage_prebuild_hexat'
      - 'compiler/**'
      - 'self/**'
  pull_request:
    paths:
      - 'self/test/miscompile_zero/**'
      - 'tool/miscompile_zero_gate.sh'
      - '.github/workflows/miscompile-zero-gate.yml'
      - 'tool/stage_resolve_runtime_a'
      - 'tool/release_build'
      - 'tool/stage_build_hexa'
      - 'tool/stage_prebuild_hexat'
      - 'compiler/**'
      - 'self/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a SUPERSEDED run only on PR re-push (a newer PR run replaces it and
  # supplies the fresh required check); push/dispatch runs always complete so
  # main's required-gate history stays intact. Frees runner minutes + shortens
  # the PR queue on rapid re-pushes. Byteeq-inert (cancels stale work; never
  # changes a build's inputs/outputs).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── dispatch — fallback-dispatch runner picker (free · always available) ─────
  # Probes whether ghost-selfhost (darwin arm64, gen2_fix slot) is ONLINE and
  # emits the darwin job's `runs-on` at runtime: ghost when online + same-repo
  # (fast, and — holding the graduated slot — the gate runs REAL instead of the
  # exit-2 NEUTRAL it takes on a slot-less cloud host), else the free GitHub-
  # hosted macos-15 fallback. Ghost-offline (or a fork PR) therefore NEVER wedges
  # this gate — it just falls back to macos-15. Mirrors the linux picker in
  # nobaseline-gate.yml 1:1 (tool/ci_pick_runner.sh · .github/actions/pick-runner).
  dispatch:
    name: dispatch (pick runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      darwin_label: ${{ steps.darwin.outputs.label }}
    steps:
      - uses: actions/checkout@v6
      - id: darwin
        uses: ./.github/actions/pick-runner
        with:
          kind: darwin
          # self-hosted only for same-repo events; fork PRs → GitHub-hosted (RCE).
          eligible: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          # administration:read PAT (self-hosted runners list needs it; the
          # default github.token CANNOT carry that scope → empty list → blind
          # fallback). Absent secret → `|| github.token` = today's harmless
          # macos-15 fallback; present → routing goes live. See PR/root-cause.
          token: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}

  miscompile-zero-gate:
    name: miscompile-zero (native emit, darwin-arm64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.darwin_label) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # Free CI accelerator: ccache the per-TU compiles (byteeq-safe — see the
      # action header + tool/stage_build_hexa R7 notes; HEXA_CCACHE only
      # reroutes the compile through the cache, never the link/emit bytes).
      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      - name: Build — shared release_build (native ./hexa driver)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
        run: bash tool/release_build

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      - name: Sanity — ./hexa runs
        shell: bash
        run: |
          set -euo pipefail
          ./hexa --version

      # ── Gate invocation (FIXED) ──────────────────────────────────────────
      # The released `./hexa` does NOT have a working native --emit=obj path in
      # CI: `hexa run compiler/main.hexa` RECOMPILES the compiler against the
      # installed embedded runtime and hits the build-floor staleness wall
      # (undeclared __raw_add_f / __raw_cmp3 …), so every emit is 0-byte. That
      # is an INFRA limitation, NOT a codegen regression — the OLD invocation
      # (HEXA_CC_PREARGS="run compiler/main.hexa") made the gate red on every
      # PR. Only the graduated self-host gen2 (ghost gen2_fix) native-emits
      # cleanly, and that is not buildable via release_build in CI.
      #
      # FIX: point the gate at a graduated native compiler IF one is present
      # (HEXA_NATIVE_CC override, e.g. a future self-host gen2 build step), else
      # let the hardened script's CANARY detect "cannot native-emit here" and
      # exit 2 (SETUP/INFRA, CI-neutral). We map exit 2 → neutral-success so the
      # gate never falsely blocks a PR, while a TRUE regression (object produced
      # but dirty) still exits 1 and fails the job.
      - name: Gate — native --emit=obj corpus must be miscompile-zero
        shell: bash
        env:
          # No HEXA_CC_PREARGS="run compiler/main.hexa" — that path is broken in
          # CI (see above). Override HEXA_NATIVE_CC to a graduated native
          # compiler to actually run the gate (the canary will then emit and the
          # floor is checked); absent that, the gate runs neutral.
          HEXA_NATIVE_CC: ${{ vars.HEXA_NATIVE_CC || './hexa' }}
          HEXA_TARGET: arm64-apple-darwin
          MCZERO_OUT: ${{ runner.temp }}/mczero-gate-out
        run: |
          set -uo pipefail
          # GitHub's default step shell runs with `-e`, so a nonzero exit from
          # the gate would ABORT the step before the exit-2 remap below (that is
          # what reded this gate). Capture rc with `|| rc=$?` so we classify it.
          rc=0
          bash tool/miscompile_zero_gate.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::miscompile-zero-gate NEUTRAL (exit 2) — this CI env cannot native-emit (no graduated gen2 compiler). The miscompile-zero floor is NOT broken; gate passes neutral."
            exit 0
          fi
          exit "$rc"

  # ── m12 try/catch setjmp RUN gate (x86_64-linux native lane) ────────────────
  # Verifies the try/catch register-rollback fix (#4541) on a REAL run: a HexaVal
  # local written inside a try body must survive the catch-path longjmp (own-IR
  # x86 pool-spill + gen2 C `volatile`). On ubuntu-latest `hexa build` is native-
  # first (#4483), so this exercises the own-IR x86 lane the pool hosts can't run
  # (aiden `hexa run` hangs). Build to a BINARY (not `hexa run`) to bypass the
  # stale ~/.hexa-cache that masks codegen changes. m12 lives in the corpus.
  trycatch-m12:
    name: try/catch setjmp m12 (native lane)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ccache-setup
      - name: Build — shared release_build (./hexa)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
        run: bash tool/release_build
      - name: Build m12 to a binary + run (bypasses the hexa-run cache)
        shell: bash
        run: |
          set -uo pipefail
          rm -rf ~/.hexa-cache 2>/dev/null || true
          rc=0
          ./hexa build self/test/miscompile_class/m12_try_catch_setjmp.hexa -o /tmp/m12bin || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::notice::m12 could not native-emit in this env (build rc=$rc) → NEUTRAL (try/catch floor NOT broken)"
            exit 0
          fi
          /tmp/m12bin
