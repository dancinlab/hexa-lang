name: nobaseline-gate

# ── .c-graduation faithful-nobaseline gate ──────────────────────────────────
#
# `.c=0` has landed on main (tracked `.c` = 0; real 3-platform release green).
# The old seed-present DRY-RUN jobs (nobaseline-* / final3-*) ASSUMED the
# bootstrap seeds were present at checkout and temp-removed / cold-compiled
# them; on a `.c=0` tree those seeds no longer exist, so those jobs failed
# forever and were self-redundant. They have been RETIRED.
#
# The faithful-nobaseline-* jobs below ARE the authoritative seed-removed gate:
# they remove ALL seeds FIRST (via $SEEDS), then build via the SAME shared
# tool/release_build + tool/release_package the real release runs, edge-pulling
# runtime.a + build/hexat. gate-green ≡ release-green by shared definition.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # PR-only path filter — docs-class PRs (state/ · ATLAS/ · *.md ·
    # ARCHITECTURE.json · CHANGELOG.jsonl) cannot affect this gate yet were
    # measured occupying the 2-slot darwin pool ~6.5 min each (run 28651193685,
    # docs-only PR#4453). The list covers every input the gate consumes:
    # release_build/release_package read self/** + tool/stage_* and compile the
    # self-host sources (compiler/**, stdlib/**); the OP fold/step gates read
    # stdlib/** + test/**; $SEEDS includes test/native_build/**; the runner
    # picker + ccache live under .github/actions/**. push:main stays UNFILTERED
    # so every main SHA is still fully gated. Merge-safe by construction: the
    # only branch-protection-required check is selfhost-gates-summary, which has
    # no path filter — a skipped nobaseline run can never wedge a merge.
    paths:
      - 'compiler/**'
      - 'self/**'
      - 'stdlib/**'
      - 'tool/**'
      - 'test/**'
      - 'install.sh'
      - '.github/workflows/nobaseline-gate.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CFLAGS_COMMON: "-O2 -std=gnu11 -D_GNU_SOURCE -Wno-trigraphs"
  # ALL 23 seeds — the 18 warm-regen seeds + 2 root bootstrap seeds + the 3
  # extra graduation seeds (hexa_cc.c, forge_tier_v1.c, the classd test
  # harness). The faithful jobs TEMP-remove ALL of them FIRST (via $SEEDS),
  # then run the VERBATIM shared release path (release_build + release_package)
  # edge-pulling runtime.a + build/hexat — so NO seed is ever compiled.
  SEEDS: >-
    self/runtime_core.c self/runtime_hi_gen.c self/runtime.c
    self/bootstrap_compiler.c
    self/native/crypto_openssl.c self/native/crypto_sodium.c
    self/native/exec_argv_sha256.c self/native/exec_pipe.c
    self/native/fp_init.c self/native/mount.c self/native/namespace.c
    self/native/net.c self/native/persistent_pipe.c self/native/proc_fork.c
    self/native/pty.c self/native/signal_flock.c self/native/tensor_kernels.c
    self/native/term_ffi.c self/native/thread.c self/native/wait.c
    self/native/hexa_cc.c self/forge/forge_tier_v1.c
    test/native_build/classd_behavioral_harness.c

concurrency:
  # Cancel a SUPERSEDED run only on PR re-push (a newer PR run replaces it and
  # supplies the fresh required check); push/dispatch runs always complete so
  # main's required-gate history stays intact. Frees runner minutes + shortens
  # the PR queue on rapid re-pushes. Byteeq-inert (cancels stale work; never
  # changes a build's inputs/outputs).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── dispatch — fallback-dispatch runner picker (free · always available) ─────
  # Probes whether a matching self-hosted runner is ONLINE and emits the heavy
  # linux job's `runs-on` at runtime: self-hosted pool (aiden/summer · 12c/30G,
  # far faster) when online + same-repo, else the free GitHub-hosted fallback.
  # Pool-offline therefore NEVER wedges this gate — it just falls back. Fork PRs
  # are forced to GitHub-hosted (no self-hosted RCE). See tool/ci_pick_runner.sh.
  dispatch:
    name: dispatch (pick runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_label: ${{ steps.linux.outputs.label }}
      # NOTE: darwin has NO picker output. The three faithful/smoke darwin jobs
      # are slot-FREE + machine-INDEPENDENT (faithful-nobaseline emits the same
      # byte result on any darwin host), so they pin directly to the free
      # GitHub-hosted `macos-15` cloud — MIRRORING faithful-nobaseline-linux-arm64
      # (`runs-on: ubuntu-24.04-arm`). This keeps them OFF the self-hosted queue
      # entirely (measured starvation 2026-07-04: 3 busy ghost + 6 idle mini +
      # 14 queued darwin jobs) — macos-15 is unlimited-free on a public repo with
      # no queue. Slot-DEPENDENT selfhost-byteeq-real (separate workflow) still
      # uses ghost's gen3 slot via its own kind=darwin picker. ci-pick-runner-sh-1.
    steps:
      - uses: actions/checkout@v6
      - id: linux
        uses: ./.github/actions/pick-runner
        with:
          kind: linux
          # self-hosted only for same-repo events; fork PRs → GitHub-hosted.
          eligible: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          # administration:read PAT (self-hosted runners list needs it; the
          # default github.token CANNOT carry that scope → empty list → blind
          # fallback). Absent secret → `|| github.token` = today's harmless
          # macos-15 fallback; present → routing goes live. See PR/root-cause.
          token: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}

  # ── symcensus-lint — axis-③ codegen↔runtime symbol-census PRIMARY guard (C-1).
  # Source-only set assertion (NO build, NO runtime.a) → runs instantly on the
  # free GitHub-hosted cloud, INDEPENDENT of the heavy faithful jobs. Seals the
  # whack-a-mole root cause at its source: a builtin that passes a checker gate
  # (_is_builtin_method / _bind_builtin_names) but is absent from codegen's
  # _builtin_runtime_sym mapping — and lacks an exemption — turns the PR RED here
  # BEFORE it can reach a run-time SIGBUS/rc127 in the self-emit path. Layered
  # with the link-time tripwire (C-2, compiler/emit/elf_x86_64.hexa) + the CI
  # dynsym gate (C-3, in the linux faithful job below).
  symcensus-lint:
    name: symcensus-lint (codegen↔runtime sym census · C-1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: axis-③ symbol-census set assertion (∅)
        shell: bash
        run: bash tool/symcensus_lint.sh

  # ── faithful-nobaseline — the authoritative seed-removed release-safety gate.
  #
  # These faithful-* jobs model a `.c=0` checkout FAITHFULLY: remove ALL seeds
  # FIRST (via $SEEDS), then resolve runtime.a AND build/hexat from the prior
  # edge tarball (NEVER prebuild either from seeds), then build + package via
  # the IDENTICAL shared entry points release.yml calls (tool/release_build then
  # tool/release_package) — with NO seed ever compiled. There is no separate
  # gate copy of the stage sequence to drift from release; this IS a dynamic
  # seed-removed run of the real release path. gate-green ≡ release-green by
  # shared definition.
  faithful-nobaseline-darwin-arm64:
    name: faithful-nobaseline (darwin-arm64)
    # macos-15 cloud DIRECT (mirror faithful-nobaseline-linux-arm64) — slot-free,
    # machine-independent, off the self-hosted queue. No `needs: dispatch`.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # FAITHFUL: remove ALL 23 seeds BEFORE anything builds — models the
      # .c=0 checkout (seeds git-removed). No source compile is possible.
      - name: Faithful — TEMP-remove ALL 23 seeds FIRST (working copy only)
        shell: bash
        run: |
          set -euo pipefail
          for f in $SEEDS; do rm -f "$f"; done
          echo "removed seeds BEFORE any build; tracked .c now:"
          git ls-files '*.c' | wc -l
          ls self/*.c 2>/dev/null || echo "  (no self/*.c — expected on .c=0)"

      # ── SINGLE-JOB-FAITHFUL: this job now runs the IDENTICAL shared entry
      # points release.yml calls — tool/release_build then tool/release_package —
      # with the 23 seeds REMOVED. There is no separate gate copy of the stage
      # sequence to drift from release; this IS a dynamic seed-removed run of the
      # real release path. gate-green ≡ release-green by shared definition.
      # Free CI accelerator: ccache the per-TU compiles (byteeq-safe — HEXA_CCACHE
      # only reroutes the compile through the cache, never the link/emit bytes).
      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      - name: Build — shared release_build (seeds removed, edge-pull)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
          # FAITHFUL preserves the edge baseline byte-for-byte → opt OUT of the
          # ship-default seed-convergence (release_build defaults it to 1). The
          # convergence is a deterministic fixpoint, so release-converged ≡
          # faithful-unconverged for every assertion below; this keeps the
          # historical darwin-arm64 faithful path byte-identical (the stage
          # comment's documented caveat).
          HEXA_SEED_CONVERGE: "0"
        run: bash tool/release_build

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      - name: Assert — ./hexa runs with seeds removed
        shell: bash
        run: |
          set -euo pipefail
          ./hexa --version
          echo "faithful-nobaseline OK (darwin-arm64)"

      # ── OP-34: machine-independence FOLD regression gate ──────────────────
      # The built ./hexa runs the two self-contained determinism oracles and
      # asserts the recorded golden folds (dt_exp 7679248634312321699 ·
      # dt_erf FWD 1088281529475491513 · dt_erf BWD 2045849491002578884 —
      # OP-138 re-pin to the float-fix-correct invariant, proven byte-identical
      # across 4 environments, F-OP19/19b/19c/19d/138; old pre-fix goldens were
      # 4548590605583584556 / 4249661408190172843, stale under the lossy
      # %g/%.17e const-fold serialize fixed by OP-37/40/132).
      # LOW BLAST RADIUS: only a REAL fold drift (or the oracle failing to
      # run) can fail this step — tool/fold_ci_gate.sh is the SSOT. <5 s.
      - name: OP-34 — fold gate (dt_exp/dt_erf golden folds, darwin-arm64)
        shell: bash
        run: |
          set -euo pipefail
          sh tool/fold_ci_gate.sh ./hexa

      # ── OP-66: flame production step-path libm-FREE tripwire ──────────────
      # OP-34 locks the dt_exp/dt_erf golden VALUES; OP-66 locks that the flame
      # CLMConvMoE PRODUCTION step actually CALLS those dt_ twins and never a raw
      # libm exp/erf/cos/sin/log/sqrt — determinism-contract LAYER 2 (libm-free).
      # libm is not correctly-rounded -> diverges glibc vs Darwin -> breaks the
      # machine-independent byte-eq training guarantee (F-OP19/19b/33). A pure
      # source grep (no ./hexa, no seed) over clm_prod.hexa + its production-
      # reachable lib surface; the deliberate _libm/_sel_ differential-oracle
      # references are exempt by name. LOW BLAST RADIUS: tool/flame_steppath_libm_
      # gate.sh is the SSOT; verified PASS on the clean tree, fails ONLY if a raw
      # libm call regresses onto the step. <1 s. BLOCKING (no seed dependency).
      - name: OP-66 — flame step-path libm-free gate (darwin-arm64)
        shell: bash
        run: |
          set -euo pipefail
          sh tool/flame_steppath_libm_gate.sh

      # ── OP-69: flame trainer step-path FMA-fused-matmul tripwire ───────────
      # OP-66 locks determinism LAYER 2 (no libm on the step); OP-69 locks
      # LAYER 3 — the CLMConvMoE PRODUCTION trainer must NOT route a determinism-
      # path matmul through the raw FMA-fused C farr_matmul/t_matmul kernel.
      # clang -O2 fuses a*b+c into a single fma on arm64 (1 rounding) but emits
      # mul+add on x86 (2 roundings) -> an accumulating matmul returns divergent
      # bytes per ISA on byte-identical fp64 inputs (F-OP29 measured arm64
      # 241449363 vs x86 1401117690). The trainer complies by routing every conv
      # GEMM through the forge_dispatch_matmul DISPATCHER seam (cuBLAS on a CUDA
      # host, cross-ISA-folded on CPU). A pure source grep (no ./hexa, no seed)
      # over clm_prod.hexa + its matmul-free production libs; the dispatcher seam
      # is the compliant path and is NOT flagged; the attention/decoder-block
      # architectures (a DIFFERENT model + the OP-29 deferred 2nd arch) are not
      # scanned. LOW BLAST RADIUS: tool/flame_steppath_fma_gate.sh is the SSOT;
      # verified PASS on the clean tree, fails ONLY if a raw FMA-fused matmul
      # regresses onto the trainer. <1 s. BLOCKING (no seed dependency).
      - name: OP-69 — flame step-path FMA-matmul gate (darwin-arm64)
        shell: bash
        run: |
          set -euo pipefail
          sh tool/flame_steppath_fma_gate.sh

      # ── OP-39: float const-fold byte-eq tripwire (ADVISORY until promote) ──
      # Locks the OP-37 (#3069) + OP-37b (#3073) SILENT float const-fold fixes
      # (0.0-X negation idiom byte-exact + computed-fold operands correctly-
      # rounded). The built ./hexa runs one self-contained oracle and asserts
      # each compile-time-folded float's IEEE-754 LE bit pattern == golden
      # (machine-independent; same goldens on every arch). LOW BLAST RADIUS:
      # tool/op39_constfold_gate.sh is the SSOT; only a REAL const-fold drift
      # (re-broken %g serialize / naive-atof parse) can fail it. <1 s.
      #
      # OP-42 extended the SAME gate/oracle with 5 hex-float cases (MUL_HF*) that
      # exercise the OP-40 (#3084) bit-exact hex-float fold-serialize fix — products
      # the old hand-rolled %.17e serialize mis-rounded by 1 ULP. No YAML change:
      # they run via the same tool/op39_constfold_gate.sh ./hexa invocation and
      # share the advisory below (the seed drifts on them identically). See
      # F-OP42-HEXFLOAT-CONTRACT-GATE.txt + docs/flame-determinism-contract.md.
      #
      # continue-on-error: TRUE — DELIBERATE. CI's ./hexa is built from the
      # FROZEN seed self/native/hexa_cc.c (151c52c8 bootstrap), which PRE-DATES
      # the OP-37/OP-37b/OP-40 source fixes in self/codegen.hexa — the fixes landed
      # in repo SOURCE (#3069/#3073/#3084) but are NOT YET PROMOTED into the seed
      # hexat (the verdicts flag this as a separate promote/rebuild step). So the
      # gate currently REPORTS the seed-toolchain bug (DRIFT to the lossy %g bits)
      # rather than passing. It is wired ADVISORY now so the regression
      # infrastructure is in place + visible; flip to blocking (drop this line)
      # in the same PR that promotes the fixes into the seed hexa_cc.c, at which
      # point this step auto-goes-GREEN. See F-OP39-CONSTFOLD-CI-GATE.txt.
      - name: OP-39 — float const-fold byte-eq gate (darwin-arm64, advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          sh tool/op39_constfold_gate.sh ./hexa

      - name: Package — shared release_package (seeds removed)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
        run: bash tool/release_package

  faithful-nobaseline-linux-x86_64:
    name: faithful-nobaseline (linux-x86_64)
    needs: dispatch
    # FALLBACK-DISPATCH (tool/ci_pick_runner.sh via `dispatch` job): runs on the
    # self-hosted x86_64 pool (aiden/summer · 12c/30G, far faster than the 2-core
    # GitHub-hosted runner) WHEN a `hexa-build` runner is online + the event is
    # same-repo; otherwise falls back to the free GitHub-hosted ubuntu-latest.
    # This is the heaviest x86_64 leg (~13–19 min on cloud). Pool-offline no
    # longer sits this job pending — it falls back, so the gate never wedges.
    # Fork PRs are forced to GitHub-hosted (no self-hosted RCE). arm64 + darwin
    # legs stay on their cloud runners (no arm64 self-hosted host).
    runs-on: ${{ fromJSON(needs.dispatch.outputs.linux_label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Faithful — TEMP-remove ALL 23 seeds FIRST (working copy only)
        shell: bash
        run: |
          set -euo pipefail
          for f in $SEEDS; do rm -f "$f"; done
          echo "removed seeds BEFORE any build; tracked .c now:"
          git ls-files '*.c' | wc -l

      # ── SINGLE-JOB-FAITHFUL — same shared release_build + release_package the
      # real release runs, with seeds removed. Dynamic seed-removed run of the
      # real release path (no separate copy). See darwin job for full rationale.
      # Free CI accelerator: ccache the per-TU compiles (byteeq-safe — HEXA_CCACHE
      # only reroutes the compile through the cache, never the link/emit bytes).
      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      - name: Build — shared release_build (seeds removed, edge-pull)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
          # FAITHFUL: opt OUT of ship-default seed-convergence (see darwin job).
          HEXA_SEED_CONVERGE: "0"
        run: bash tool/release_build

      - name: nm-UND floor dump — RFC061 zero-c authoritative reducible libc (advisory)
        if: always()
        shell: bash
        run: |
          # RFC061 §M8 frozen-flip prerequisite: emit the DEFAULT build's undefined-libc
          # floor so the reducible set is measurable from the CI log (mini cannot build;
          # ad-hoc pool release_build/build_selfhost miss env → authoritative measurement
          # is CI-harness-bound). Advisory only (never gates). SSOT: memory
          # project_hexa_functional_zeroc_libc_floor_census.
          RT="$(find build . -name runtime.a 2>/dev/null | head -1)"
          echo "runtime.a: $RT ($(stat -c%s "$RT" 2>/dev/null || echo 0) bytes)"
          if [ -f "$RT" ]; then
            echo "=== RFC061 nm-UND reducible libc floor (sanctioned FFI/CRT/hexa-own/cuda excluded) ==="
            nm -u "$RT" 2>/dev/null | awk '{print $2}' | sort -u \
              | grep -vE '^(_hx_|__hexa|__hx_|__blk_|rt_|hexa_|_hexa|_?hxlcl_|_GLOBAL)' \
              | grep -vE 'cuda|fatbin' \
              | grep -vE '^(accept|bind|connect|listen|socket|recv|recvfrom|send|sendto|setsockopt|getsockopt|getaddrinfo|freeaddrinfo|gai_strerror)' \
              | grep -vE '^(__libc_|_exit|atexit|environ|mallopt|__cxa|__errno_location|__stack_chk|__assert)' \
              | grep -vE '^(execve|execvp|setns|unshare|mount|umount2?|posix_spawn|opendir|readdir|closedir|glob|globfree|mkstemp|mkdtemp)' \
              | grep -vE '^(rand|srand|strtod|strtof|strtold)' \
              | grep -vE '^(__init_array_start|__init_array_end|main|array_store|fs_write_all_native|join)$' \
              | tr '\n' ' '
            echo ""
            echo "=== RFC061 nm-UND TOTAL undefined: $(nm -u "$RT" 2>/dev/null | awk '{print $2}' | sort -u | wc -l) ==="
          else
            echo "(no runtime.a found — nm-UND dump skipped)"
          fi

      - name: RFC061 substrate-dump — generated-C reduction TRACK-S (advisory)
        if: always()
        shell: bash
        run: |
          # RFC061 axis-② (runtime.c→0) per-round reduction signal — sibling of the
          # nm-UND floor dump, advisory only (NEVER gates). Three metrics track the
          # generated-C substrate the DEFAULT build still compiles through $CC:
          #   ① compiled generated-.c TU count  ② runtime*.c live #include "native/*.c"
          #   ③ total generated-C LOC handed to $CC.  SSOT: state/rfc061-axis2-runtime-
          #   zero-attack-plan (TRACK-S). Measured post-build (the faithful gate removes
          #   all seeds then release_build regenerates the .c at self/*.c). mini cannot
          #   build → this measurement is CI-harness-bound, same as the nm-UND dump.
          GENC="self/runtime.c self/runtime_core.c self/runtime_hi_gen.c self/native/hexa_cc.c"
          tus=0; loc=0; present=""
          for f in $GENC; do
            if [ -f "$f" ]; then
              tus=$((tus + 1)); loc=$((loc + $(wc -l < "$f" 2>/dev/null || echo 0)))
              present="$present $f"
            fi
          done
          inc=0
          for f in self/runtime.c self/runtime_core.c; do
            [ -f "$f" ] && inc=$((inc + $(grep -cE '^[[:space:]]*#include[[:space:]]*"native/[^"]*\.c"' "$f" 2>/dev/null || echo 0)))
          done
          echo "=== RFC061 substrate-dump (advisory · never gates · TRACK-S) ==="
          echo "generated-.c compiled TUs: $tus (present:$present )"
          echo "runtime*.c live #include \"native/*.c\": $inc"
          echo "generated-C total LOC to \$CC: $loc"

      - name: zero-c #29 S1 — runtime.a dl* nm-UND ∅ (HARD GATE · Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          # S1 FFI floor-partition: dlopen/dlsym/dlerror moved into runtime_ffi_dyn.o
          # (compiled but NOT ar'd into canonical runtime.a), so the archive must carry
          # ZERO dl* nm-UND. Unfiltered hard assertion — the flip is the first real test
          # (OFF-verification cannot validate this; see convergence runtime-emit-full-hexa-2).
          RT="$(find build . -name runtime.a 2>/dev/null | head -1)"
          if [ ! -f "$RT" ]; then echo "(no runtime.a — S1 dl* gate skipped)"; exit 0; fi
          HITS="$(nm -u "$RT" 2>/dev/null | awk '{print $2}' | sort -u | grep -E '^dl(open|sym|error|close|addr)$' || true)"
          if [ -n "$HITS" ]; then
            echo "❌ S1 FAIL — canonical runtime.a still carries dl* nm-UND:"; echo "$HITS"; exit 1
          fi
          echo "✅ S1 GREEN — runtime.a nm-UND dl* = ∅ (unfiltered) — $RT"

      - name: axis-③ symcensus — own-linked cc-self-bin dynsym UND ⊆ sanctioned (C-3 · Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          # Guard C-3 (defence layer, sibling of the dl* hard gate above): the
          # FINAL own-linked (hexa_ld / --linker=hexa) self-emit binary must carry
          # NO dynamic-symbol UND outside the sanctioned libc floor. A codegen↔
          # runtime symbol mismatch that slipped BOTH the source lint (C-1) and the
          # link-time tripwire (C-2) — e.g. via a brand-new emit path that bypasses
          # _builtin_runtime_sym — surfaces here as a stray dyn UND (bare `zip`,
          # `read_file_bytes`, or a `hexa_*`/`rt_*` name that leaked dynamic).
          # Skip-if-absent (like the dl* gate): activates the moment a future
          # step deposits an own-linked binary at HEXA_CC_SELF_BIN or build/.
          BIN="${HEXA_CC_SELF_BIN:-}"
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            BIN="$(find build . -type f \( -name 'cc-self*' -o -name 'hexa-ownlink*' -o -name '*.ownstart' \) 2>/dev/null | head -1)"
          fi
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "(no own-linked cc-self-bin artifact — C-3 dynsym gate skipped; activates when a self-emit own-link step deposits one)"
            exit 0
          fi
          command -v readelf >/dev/null 2>&1 || { echo "(no readelf — C-3 skipped)"; exit 0; }
          echo "C-3 subject: $BIN"
          # Dynamic UND symbol names (readelf --dyn-syms, UND section == index 0).
          UND="$(readelf --dyn-syms -W "$BIN" 2>/dev/null \
                 | awk '$7=="UND" && $8!="" {print $8}' | sed 's/@.*//' | sort -u)"
          if [ -z "$UND" ]; then
            echo "✅ C-3 GREEN — own-linked $BIN carries ZERO dynamic UND"; exit 0
          fi
          # Sanctioned floor = the genuine libc UNDs an own-link legitimately routes
          # dynamic. Reuses the nm-UND advisory chain (FFI/CRT/exec/rand families)
          # and adds the mem/str/heap/io floor. ANY residual = a leaked mismatch.
          RESID="$(printf '%s\n' "$UND" \
            | grep -vE '^(memcpy|memset|memmove|memcmp|memchr|strlen|strcmp|strncmp|strcpy|strncpy|strcat|strchr|strrchr|strstr|strdup|strtol|strtoll)$' \
            | grep -vE '^(malloc|free|calloc|realloc|aligned_alloc|posix_memalign|mallopt)$' \
            | grep -vE '^(read|write|open|close|lseek|mmap|munmap|mprotect|brk|sbrk|_?exit|abort)$' \
            | grep -vE '^(accept|bind|connect|listen|socket|recv|recvfrom|send|sendto|setsockopt|getsockopt|getaddrinfo|freeaddrinfo|gai_strerror)$' \
            | grep -vE '^(__libc_|__cxa|__errno_location|__stack_chk|__assert|atexit|environ)' \
            | grep -vE '^(execve|execvp|setns|unshare|mount|umount2?|posix_spawn|opendir|readdir|closedir|glob|globfree|mkstemp|mkdtemp)$' \
            | grep -vE '^(rand|srand|strtod|strtof|strtold)$' \
            | grep -vE '^(__init_array_start|__init_array_end)$' \
            || true)"
          if [ -n "$RESID" ]; then
            echo "❌ C-3 FAIL — own-linked $BIN has NON-sanctioned dynamic UND (codegen↔runtime sym leak):"
            printf '%s\n' "$RESID" | sed 's/^/    /'
            echo "  fix: add the corresponding _builtin_runtime_sym mapping (arm64_darwin.hexa)"
            echo "  so the symbol resolves to its runtime.a def instead of leaking to libc.so.6."
            exit 1
          fi
          echo "✅ C-3 GREEN — own-linked $BIN dynamic UND ⊆ sanctioned libc floor"

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      - name: Assert — ./hexa runs with seeds removed
        shell: bash
        run: |
          set -euo pipefail
          ./hexa --version
          echo "faithful-nobaseline OK (linux-x86_64)"

      # ── OP-34: machine-independence FOLD regression gate (see darwin job
      # for full rationale). SSOT = tool/fold_ci_gate.sh; <5 s; fails ONLY on
      # a real deterministic-fold drift vs the 4-environment goldens.
      - name: OP-34 — fold gate (dt_exp/dt_erf golden folds, linux-x86_64)
        shell: bash
        run: |
          set -euo pipefail
          sh tool/fold_ci_gate.sh ./hexa

      # ── OP-69: flame trainer step-path FMA-fused-matmul tripwire (LAYER 3 —
      # cross-ISA). Run on x86_64 too: this gate is the cross-ISA invariant
      # (arm64 fma vs x86 mul+add), so enforcing it on the x86 leg as well as
      # the arm64 leg makes the layer-3 lock symmetric. Pure source grep (no
      # ./hexa, no seed) over clm_prod.hexa + its matmul-free production libs;
      # forge_dispatch_matmul dispatcher seam is compliant + not flagged. SSOT =
      # tool/flame_steppath_fma_gate.sh; <1 s. BLOCKING. See darwin job + F-OP29.
      - name: OP-69 — flame step-path FMA-matmul gate (linux-x86_64)
        shell: bash
        run: |
          set -euo pipefail
          sh tool/flame_steppath_fma_gate.sh

      # ── OP-39/OP-42: float const-fold byte-eq tripwire (ADVISORY until promote;
      # see darwin job for full rationale). 18 cases: OP-39's 13 + OP-42's 5
      # hex-float MUL_HF* (OP-40 #3084 bit-exact hex-float serialize). continue-on-
      # error TRUE: CI's ./hexa is the frozen seed hexat (pre-OP-37/37b/40); the
      # gate reports the seed-toolchain bug until the fix is promoted into the seed
      # hexa_cc.c, then auto-goes-GREEN. SSOT = tool/op39_constfold_gate.sh; <1 s.
      - name: OP-39 — float const-fold byte-eq gate (linux-x86_64, advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          sh tool/op39_constfold_gate.sh ./hexa

      - name: Package — shared release_package (seeds removed)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
        run: bash tool/release_package

  faithful-nobaseline-linux-arm64:
