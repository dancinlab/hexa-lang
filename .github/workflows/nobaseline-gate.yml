        run: bash tool/release_package

  # ── SELFEMIT live-link smoke — RFC061 §M8 foundation verification (ADVISORY) ──
  #
  # NON-REQUIRED · independent job. It is NOT wired into any required status check
  # (selfhost-gates-required / faithful-nobaseline-*), so a RED here NEVER blocks a
  # merge and the release/gate semantics above are UNCHANGED — it only REPORTS
  # whether the §M8 HEXA_RT_SELFEMIT native-emit runtime.a actually live-links a
  # real consumer binary, end-to-end.
  #
  # WHY this job exists: the §M8 ladder (r2..r10) has landed 21/55 libc-substrate
  # symbols as hexa-NATIVE self-emitted .o members of build/runtime.a —
  # hxlcl_{close,read,strlen,memcpy,memset,memcmp,strcmp,strcpy,strncmp,strncpy,
  # strcat,strchr,lseek,dup2,mkdir,waitpid,stat,atoi,strdup,fcntl,poll}. r10 adds
  # fcntl/poll (svc no-errno leaves) + atoi/strdup (BRANCH26 composites whose
  # callees atoll/malloc stay shim-provided). Until now the only proof was the
  # script's internal `ld -r`
  # member merge (multidef==0). This job adds the missing surface: a FULL SELFEMIT
  # runtime.a built + linked into exit42/hello and RUN — the undefined==0 +
  # behavior proof — before more leaves are stacked on an unverified foundation.
  #
  # DARWIN-ONLY: the emit fixtures bake Mach-O arm64 syscall numbers + ld64
  # PAGE21/PAGEOFF12 relocs, so HEXA_RT_SELFEMIT engages only on darwin-arm64
  # (aiden/summer linux cannot exercise it). macos-latest cloud runner (no
  # arm64 self-hosted host); mirrors the faithful-nobaseline-darwin-arm64 leg.
  #
  # CODE-NEUTRAL: this PR adds ONLY this CI job. HEXA_RT_SELFEMIT stays default-OFF
  # everywhere (release_build never sets it), so shipping binaries + byteeq +
  # tracked `.c`=0 are untouched.
  selfemit-livelink-smoke-darwin-arm64:
    name: SELFEMIT live-link smoke (darwin-arm64, advisory)
    # macos-15 cloud DIRECT (slot-free advisory smoke · off self-hosted queue).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Free CI accelerator: ccache the per-TU compiles (byteeq-safe — HEXA_CCACHE
      # only reroutes the compile through the cache, never the link/emit bytes).
      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      # ── (1) Build ./hexa via the SHARED release path (DEFAULT runtime.a =
      #    libc-shim members; HEXA_RT_SELFEMIT unset). This both produces the
      #    ./hexa consumer compiler AND restores the gitignored self/runtime.c
      #    seed (.c=0 checkout → restore_frozen_seeds), which the SELFEMIT rebuild
      #    in step (2) needs present. A 2-pass shape is REQUIRED: stage_resolve_
      #    runtime_a runs FIRST inside release_build (before ./hexa exists), and the
      #    SELFEMIT pass needs ./hexa as HEXA_SELFEMIT_BIN to run the emit fixtures.
      - name: (1) Build ./hexa — shared release_build (default runtime.a)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
        run: |
          set -euo pipefail
          bash tool/release_build
          ./hexa --version
          echo "(1) ./hexa built + seeds restored OK"

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      # ── (2) Rebuild build/runtime.a WITH the §M8 SELFEMIT native members.
      #    SELFEMIT is nested INSIDE the HEXA_RT_MULTIOBJ packaging branch — BOTH
      #    must be 1. With HEXA_SELFEMIT_BIN=./hexa it runs the 21
      #    test/native_build/emit_hxlcl_*_o.hexa fixtures to emit native .o members,
      #    drops the matching libc-shim defs (-DHEXA_RT_SELFEMIT_<SYM>), adds the
      #    1-cell errno provider for close/read, and runs its OWN `ld -r` multidef
      #    safety gate (FATAL on any duplicate def). Seeds present (restored in
      #    step 1) → build_runtime_a_from_source path (no edge-pull / GH_TOKEN).
      - name: (2) Rebuild runtime.a — HEXA_RT_SELFEMIT=1 (21 native members)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          HEXA_RT_MULTIOBJ: "1"
          HEXA_RT_SELFEMIT: "1"
          HEXA_SELFEMIT_BIN: ./hexa
          # SELFEMIT isolation (convergence selfemit-smoke-4591-codrop-default-mismatch):
          # strcmp/strncmp/strchr/strdup are now default-auto RT-NATIVE frozen-seed leaves
          # AND appear in the SELFEMIT 21-list — their seed member collides with the
          # self-emitted member (S5 multidef). This smoke measures the SELFEMIT emitter
          # ALONE, so pin the overlapping seed gates OFF (strstr is NOT in the SELFEMIT list).
          HEXA_RT_NATIVE_STRCMP: "0"
          HEXA_RT_NATIVE_STRNCMP: "0"
          HEXA_RT_NATIVE_STRCHR: "0"
          HEXA_RT_NATIVE_STRDUP: "0"
        run: |
          set -euo pipefail
          mkdir -p build
          bash tool/stage_resolve_runtime_a 2>&1 | tee build/_selfemit_resolve.log
          echo "── build/runtime.a members ──"
          ar t build/runtime.a

      # ── (3) Assert the 21 native members + errno provider landed, and the
      #    self-emitted hxlcl_* symbols are DEFINED (T) — not the dropped shim.
      - name: (3) Assert 21 SELFEMIT members present + symbols defined
        shell: bash
        run: |
          set -euo pipefail
          members="$(ar t build/runtime.a)"
          syms="$(nm build/runtime.a 2>/dev/null || true)"
          missing_member=0; undef_sym=0; ok_member=0; ok_sym=0
          # NOTE: match via here-string (<<<), NOT `printf … | grep -q`. Under
          # `set -o pipefail`, grep -q exits on the FIRST match and closes the
          # pipe while printf is still writing the large $syms blob → SIGPIPE →
          # printf exits 141 → pipefail makes the whole pipeline non-zero → the
          # `if` flips to the else branch and a DEFINED symbol is mis-reported as
          # "NOT DEFINED" (race on symbol position in the nm stream — same broken
          # -pipe class as #3833). A here-string has no writer process to SIGPIPE.
          for s in close read strlen memcpy memset memcmp strcmp strcpy strncmp strncpy strcat strchr lseek dup2 mkdir waitpid stat atoi strdup fcntl poll; do
            if grep -qx "hxlcl_${s}_native.o" <<<"$members"; then
              ok_member=$((ok_member+1))
            else
              echo "  MISSING MEMBER: hxlcl_${s}_native.o"; missing_member=$((missing_member+1))
            fi
            # Mach-O external text def shows as ` T _hxlcl_<s>`.
            if grep -qE " T _hxlcl_${s}\$" <<<"$syms"; then
              ok_sym=$((ok_sym+1))
            else
              echo "  SYMBOL NOT DEFINED (T): _hxlcl_${s}"; undef_sym=$((undef_sym+1))
            fi
          done
          echo "(3) members ok=$ok_member/21 missing=$missing_member ; defined syms ok=$ok_sym/21 undef=$undef_sym"
          if grep -qx "hxlcl_errno_provider.o" <<<"$members"; then
            echo "(3) errno provider member present (close/read external _hxlcl_errno satisfied)"
          else
            echo "(3) FAIL: hxlcl_errno_provider.o missing (close/read would be undefined at consumer link)"; exit 1
          fi
          [ "$missing_member" -eq 0 ] && [ "$undef_sym" -eq 0 ] || { echo "(3) FAIL — SELFEMIT member/symbol shortfall"; exit 1; }

      # ── (4) Surface the script's OWN ld -r multidef gate result (==0 expected;
      #    a nonzero would already have FATAL-failed step 2 — this asserts it too).
      - name: (4) Assert ld -r multidef == 0
        shell: bash
        run: |
          set -euo pipefail
          md="$(grep -oE 'multiple_definition=[0-9]+' build/_selfemit_resolve.log | tail -1 | cut -d= -f2)"
          echo "(4) ld -r multiple_definition=${md:-<not-found>}"
          [ "${md:-1}" = "0" ] || { echo "(4) FAIL — multidef != 0"; exit 1; }

      # ── (5) CONSUMER LIVE-LINK SMOKE — the missing surface. Build exit42 + hello
      #    with ./hexa linking the SELFEMIT runtime.a (HEXA_PREBUILT_RUNTIME), then
      #    RUN. No --target → the prebuilt-runtime link path engages. A clean
      #    build+run is the undefined==0 + behavior proof for the 21 native members.
      - name: (5) exit42 + hello live-link smoke (SELFEMIT runtime.a alone)
        shell: bash
        env:
          # exit42/hello write under /tmp, which `hexa build` REFUSES on Darwin
          # (kernel-panic-path guard, self/main.hexa:3004). HEXA_MAC_BUILD_OK=1 is
          # the documented CI bypass for non-heavy dry-run builds — same as every
          # tool/build_hexa_*.sh and release_package's darwin-arm64 export.
          HEXA_MAC_BUILD_OK: "1"
        run: |
          set -euo pipefail
          export HEXA_PREBUILT_RUNTIME="$PWD/build/runtime.a"
          echo "  HEXA_PREBUILT_RUNTIME=$HEXA_PREBUILT_RUNTIME"

          # exit42 → rc 42
          printf 'fn main() {\n  exit(6 * 7)\n}\n' > /tmp/exit42.hexa
          ./hexa build /tmp/exit42.hexa -o /tmp/exit42 2>&1 | tee /tmp/exit42.build.log
          if /tmp/exit42; then e42rc=0; else e42rc=$?; fi
          echo "  exit42 rc=$e42rc (expect 42)"

          # hello → "hello"
          printf 'fn main() {\n  println("hello")\n}\n' > /tmp/hello.hexa
          ./hexa build /tmp/hello.hexa -o /tmp/hello 2>&1 | tee /tmp/hello.build.log
          hello_out="$(/tmp/hello || true)"
          echo "  hello output: '$hello_out' (expect hello)"

          # undefined==0 proof: scan the link logs for any unresolved hxlcl_*.
          undef="$( (grep -iE 'undefined|Undefined symbols|symbol not found' /tmp/exit42.build.log /tmp/hello.build.log || true) | grep -c hxlcl || true)"
          echo "── verdict ──"
          echo "  exit42_rc=$e42rc hello_ok=$([ "$hello_out" = "hello" ] && echo true || echo false) hxlcl_undefined=$undef"
          [ "$e42rc" = "42" ] || { echo "FAIL: exit42 rc != 42"; exit 1; }
          [ "$hello_out" = "hello" ] || { echo "FAIL: hello output != hello"; exit 1; }
          [ "$undef" = "0" ] || { echo "FAIL: $undef undefined hxlcl_* at consumer link"; exit 1; }
          echo "SELFEMIT live-link smoke GREEN — 21/55 §M8 members link + run (darwin-arm64)"

  # ── ROUTE C ON-PATH emit smoke — RFC061 §M8 verify-done gap closure (ADVISORY) ──
  #
  # SIBLING to the SELFEMIT smoke above, but exercises the OTHER §M8 path: the
  # Route C per-fn C-ABI codegen (`HEXA_CABI_HXLCL`). The SELFEMIT job runs the
  # hand-assembled SEED objects; this job runs the actual Route C EMIT of
  # stdlib/runtime/hxlcl_core.hexa — emit with HEXA_CABI_HXLCL=1, link the
  # emitted .o against a self-contained C harness (which supplies the composite
  # inner-callee leaves hxlcl_malloc/hxlcl_atoll and CALLS every Route-C-emitted
  # symbol with raw C-ABI prototypes + behaviour asserts), then RUN. A clean
  # build + all-asserts-pass is the direct ON-path proof the Route C emit produces
  # correct, linkable, behaviourally-faithful raw-C-ABI objects — the coverage the
  # SELFEMIT (seed) smoke does NOT provide (seed shape-match was the prior, weaker,
  # inferential evidence). Advisory first; promote to required after measured green.
  #
  # DARWIN-ONLY: aprime_cc builds Mach-O arm64 (clang -arch arm64) — the single
  # host where the patched compiler builds. macos-15 cloud runner (github-hosted;
  # no blacksmith). CODE-NEUTRAL: adds ONLY this job + tool/routec_cabi_smoke.sh;
  # HEXA_CABI_HXLCL stays default-OFF everywhere (release_build never sets it), so
  # shipping binaries + byteeq + tracked `.c`=0 are untouched.
  routec-cabi-smoke-darwin-arm64:
    name: Route C ON-path emit smoke (darwin-arm64, advisory)
    # macos-15 cloud DIRECT (slot-free advisory smoke · off self-hosted queue).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      # (1) Build ./hexa via the shared release path — also restores the gitignored
      #     self/native/hexat transpiler + self/runtime.c seeds that build_aprime
      #     needs present.
      - name: (1) Build ./hexa — shared release_build (restores hexat + seeds)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
        run: |
          set -euo pipefail
          bash tool/release_build
          ./hexa --version
          echo "(1) ./hexa built + hexat/seeds restored OK"

      # (2) Build aprime_cc (the native arm64-asm compiler) — the binary that emits
      #     the Route C .s under HEXA_CABI_HXLCL=1.
      - name: (2) Build aprime_cc
        shell: bash
        run: |
          set -euo pipefail
          bash tool/build_aprime.sh -o build/aprime_cc
          [ -x build/aprime_cc ] && echo "(2) aprime_cc built OK"

      # (3) Emit hxlcl_core.hexa with HEXA_CABI_HXLCL=1, link the Route C .o against
      #     the behaviour harness, run + assert. The script is a loud no-op off
      #     darwin-arm64 (it is the only host here, so it runs).
      - name: (3) Route C emit + link + behaviour run
        shell: bash
        env:
          APRIME: build/aprime_cc
          CC: clang
        run: |
          set -euo pipefail
          bash tool/routec_cabi_smoke.sh

  # ── Route C ON-path errno smoke (LINUX) — the errno-store value-exact gate ───
  # The darwin smoke above DCE's out hxlcl_close's errno-store leg (its
  # target_is_linux() guard is a compile-time FALSE const on darwin), so the ②
  # extern-data substrate (errno SET via __errno_location + __hx_ptr_store32) has
  # NO ON-path coverage there. This LINUX sibling runs the errno-store LIVE and
  # asserts close's errno contract VALUE-EXACT (errno == EBADF) — the substrate's
  # core claim. Self-hosted x86_64 pool (aiden/summer) when online; fork PRs +
  # offline pool fall back to GitHub-hosted via the dispatch job, same as the
  # faithful-nobaseline linux-x86_64 leg. Advisory first (promote after green).
  # CODE-NEUTRAL: adds ONLY this job + tool/routec_cabi_smoke_linux.sh;
  # HEXA_CABI_HXLCL stays default-OFF (release_build never sets it).
  routec-cabi-smoke-linux-x86_64:
    name: Route C ON-path errno smoke (linux-x86_64, advisory)
    # HOSTED-PINNED (advisory): free ubuntu-latest cloud runner — measured on
    # the pool this advisory job occupied summer 2m17s AHEAD of the required-
    # path faithful job, which then queued 25m28s. Advisory work never takes a
    # self-hosted slot.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      # (1) Build ./hexa via the shared release path — restores the gitignored
      #     hexat transpiler + self/runtime.c seeds that build_aprime needs.
      - name: (1) Build ./hexa — shared release_build (restores hexat + seeds)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
        run: |
          set -euo pipefail
          bash tool/release_build
          ./hexa --version
          echo "(1) ./hexa built + hexat/seeds restored OK (linux-x86_64)"

      # (2) Build aprime_cc (the native x86_64-asm compiler) — the binary that
      #     emits the Route C .s under HEXA_CABI_HXLCL=1 for the linux target.
      - name: (2) Build aprime_cc
        shell: bash
        run: |
          set -euo pipefail
          bash tool/build_aprime.sh -o build/aprime_cc
          [ -x build/aprime_cc ] && echo "(2) aprime_cc built OK"

      # (3) Emit hxlcl_core.hexa (--target=x86_64-linux), link the Route C .o
      #     against the errno harness, run + assert errno == EBADF value-exact.
      - name: (3) Route C errno emit + link + value-exact run
        shell: bash
        env:
          APRIME: build/aprime_cc
          CC: gcc
        run: |
          set -euo pipefail
          bash tool/routec_cabi_smoke_linux.sh

  # ── C-4 libgcc-lowering builtin forbid (source lint · target-independent) ────
  # WHY: __popcountdi2 (the axis-③ cc-self-bin own-link RUN wall, #4845) came from
  # __builtin_popcountll in the emitted-C runtime substrate — gcc lowers such
  # builtins to a libgcc soft-int helper CALL, which the -nostdlib own-link (no
  # -lgcc) leaves undefined → rc127 at the dynamic loader. It leaked SILENTLY to a
  # paid pod because no CI gate scanned the emitted-C for this class (symcensus C-1
  # is hexa-level only; the dynsym C-3 gate is skip-if-absent and does not run the
  # own-emit+own-link path). This gate FAILS LOUDLY at PR time on any such builtin
  # in the runtime emitter SSOTs. CALL-SHAPED (requires `(`) so a legitimate
  # comment mention — runtime_emit_full.hexa names it in "NOT __builtin_popcountll)"
  # — does NOT false-trip. Free · <5 s · BLOCKING · target-independent (a source
  # lint, so it catches the leak on every target at once).
  libgcc-forbid:
    name: C-4 libgcc-lowering builtin forbid (source lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: forbid libgcc-lowering builtins in runtime emitter SSOTs
        shell: bash
        run: |
          set -euo pipefail
          hits=$(grep -nE '__builtin_(popcount|parity|clz|ctz|bswap|ffs)[a-z]*\(|__builtin_(mul|add|sub)_overflow\(|__int128' \
            self/runtime_emit_full.hexa self/runtime_core_emit.hexa self/runtime_core_hxlcl_shim_emit.hexa || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "FAIL: libgcc-lowering builtin in the emitted-C runtime substrate."
            echo "gcc lowers it to a libgcc soft-int call left UNDEFINED by the -nostdlib"
            echo "own-link (no -lgcc) → rc127 at ld.so on cc-self-bin (see #4845)."
            echo "Fix: emit a portable C body, or provide the helper as a runtime def."
            exit 1
          fi
          echo "C-4 OK — no libgcc-lowering builtin in runtime emitter SSOTs"

  # axis-2 ON-path gate: HEXA_RT_STDIO_NATIVE=1 compiles the MULTIOBJ print-family
  # redirect (default-OFF byte-neutral, so the OFF byteeq/faithful lanes never exercise
  # it — runtime-emit-full-hexa-2: OFF verification can't catch an ON-body defect).
  # Builds the real ship recipe with the flag ON and asserts the glibc stdio UND
  # (printf/fprintf/perror/snprintf) actually LEFT runtime.a — proving the redirect
  # applied + runtime.o exported hxlcl_* + the archive linked. Advisory (not in the
  # required selfhost-gates-summary set until measured green, per CLAUDE.md).
  stdio-native-onpath-x86_64:
    name: stdio-native ON-path (MULTIOBJ redirect, linux-x86_64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.linux_label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: ccache setup
        uses: ./.github/actions/ccache-setup
      - name: release_build with HEXA_RT_STDIO_NATIVE=1 + assert print-family UND dropped
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
          HEXA_RT_STDIO_NATIVE: "1"
        run: |
          set -euo pipefail
          bash tool/release_build
          RT="$(find build . -name runtime.a 2>/dev/null | head -1)"
          [ -f "$RT" ] || { echo "no runtime.a produced"; exit 1; }
          echo "runtime.a: $RT ($(stat -c%s "$RT") bytes)"
          U=$(nm "$RT" 2>/dev/null | grep -cE ' U (printf|fprintf|perror|snprintf)$' || true)
          echo "stdio-native ON: runtime.a U(printf/fprintf/perror/snprintf) = $U (want 0)"
          if [ "$U" != 0 ]; then
            echo "FAIL: HEXA_RT_STDIO_NATIVE=1 but $U glibc stdio UND remain — redirect incomplete"
            echo "  (check S2/S3 _zc_stdio routing in tool/stage_resolve_runtime_a + the HXLCL_STDIO_LINK export)"
            nm "$RT" | grep -E ' U (printf|fprintf|perror|snprintf)$' | sort -u
            exit 1
          fi
          echo "OK — MULTIOBJ print-family redirected to runtime.o hxlcl_* raw write(2); glibc stdio UND dropped (axis-2)"

  # axis-3 L1: own-link determinism gate (emit-twice + link-twice byte-identical on
  # a broad-UND fixture) — the default-flip prerequisite. HEXA_ZEROC_EXIT_FLUSH=1
  # (merged #4852, mangle-fixed #4853) makes the MULTIOBJ own-start runtime.a flush
  # buffered print at exit so build_native's stage5 print("hi")+exit(7) survives → the
  # gate runs. Advisory (not in the required selfhost-gates-summary set yet).
  ownlink-determinism-x86_64:
    name: own-link determinism (emit+link twice, linux-x86_64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.linux_label) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: ccache setup
        uses: ./.github/actions/ccache-setup
      - name: Build toolchain + converged runtime.a (shared release_build)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
          HEXA_RT_STDIO_NATIVE: "1"
        run: bash tool/release_build
      - name: Build cc_native (preserve the converged runtime.a first)
        shell: bash
        env:
          HEXA_RT_STDIO_NATIVE: "1"
        run: |
          set -euo pipefail
          # converged runtime.a (libgcc-clean #4845 + exit-flush ON); build_native may
          # restore frozen seeds + rebuild it, so snapshot first.
          cp build/runtime.a "$RUNNER_TEMP/rt_converged.a"
          bash tool/build_native_linux_x86_64 -r "$PWD" -w "$PWD/build/lx8664"
          [ -x build/lx8664/cc_native ] && echo "cc_native = $(stat -c%s build/lx8664/cc_native) B"
      - name: own-link determinism gate (emit+link twice + static floor)
        shell: bash
        env:
          REPO: ${{ github.workspace }}
          CC_NATIVE: ${{ github.workspace }}/build/lx8664/cc_native
          HEXA_PREBUILT_RUNTIME: ${{ runner.temp }}/rt_converged.a
        run: bash tool/ownlink_determinism_gate

  # axis-3 L1: own-link RUN-parity gate (own-link vs system-ld from the SAME own-
  # emitted .o) — the PR-2 default-flip evidence. A mislinked-but-executable binary
  # does NOT trip the build fall-through, so run-parity (stdout+rc identical across
  # the corpus) is the only sound gate for flipping the linker. Advisory (not in the
  # required selfhost-gates-summary set yet — promote after a green soak, per the
  # CI rule "measure a job green before making it required").
  ownlink-corpus-parity-x86_64:
    name: own-link corpus parity (own-link vs ld, linux-x86_64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.linux_label) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: ccache setup
        uses: ./.github/actions/ccache-setup
      - name: Build toolchain + converged runtime.a (shared release_build)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
          HEXA_RT_STDIO_NATIVE: "1"
        run: bash tool/release_build
      - name: Build cc_native (preserve the converged runtime.a first)
        shell: bash
        env:
          HEXA_RT_STDIO_NATIVE: "1"
        run: |
          set -euo pipefail
          cp build/runtime.a "$RUNNER_TEMP/rt_converged.a"
          bash tool/build_native_linux_x86_64 -r "$PWD" -w "$PWD/build/lx8664"
          [ -x build/lx8664/cc_native ] && echo "cc_native = $(stat -c%s build/lx8664/cc_native) B"
      - name: own-link corpus RUN-parity gate (own-link vs ld)
        shell: bash
        env:
          REPO: ${{ github.workspace }}
          CC_NATIVE: ${{ github.workspace }}/build/lx8664/cc_native
          HEXA_PREBUILT_RUNTIME: ${{ runner.temp }}/rt_converged.a
          CC: gcc
        run: bash tool/ownlink_corpus_parity_gate

  # axis-1 hexa_cc.c C-transpile-delegate removal census — with own-link default-ON
  # (#4882), every linux-x86_64 `hexa build` must take the own-link leg (never tier-B
  # ld, never the C-transpile delegate resolve_or_bootstrap_hexat). A green soak here
  # = the delegate is dead code on the default leg → removable (axis-① DONE). This is
  # DISTINCT from ENCODE-MISS=0 (codegen coverage) + corpus-parity (link correctness):
  # it proves the CLI cmd_build ladder actually takes own-link + never falls through.
  # Advisory (promote to required after a green soak).
  cfallback-zero-census-x86_64:
    name: cfallback-zero census (hexa build → own-link, no C-transpile, linux-x86_64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.linux_label) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: ccache setup
        uses: ./.github/actions/ccache-setup
      - name: (1) Build ./hexa + stage the SHIPPED consumer artifact (ships aprime_cc per r27)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
          HEXA_RT_STDIO_NATIVE: "1"
        run: |
          set -euo pipefail
          bash tool/release_build
          ./hexa --version
          # stage_precompile_package = the exact packaging a consumer install consumes;
          # r27 builds+ships build/aprime_cc so the own-link default leg can fire. The
          # census MUST test THIS artifact (not the bare release_build tree), else it
          # models an env no consumer has — see tool/cfallback_zero_census FIDELITY note.
          bash tool/stage_precompile_package
          echo "── staged consumer artifact ──"; ls -la dist/hexa-linux-x86_64 dist/hexa-linux-x86_64/build
      - name: (2) HARD packaging gate — aprime_cc must be in the staged install
        shell: bash
        run: |
          # Separate from the census so a RED here pinpoints PACKAGING (stage_precompile_
          # package r27 aprime build flaked) vs the CLI ladder itself. On linux-x86_64 the
          # own-link default REQUIRES this binary; a missing one = silent clang-fallback.
          test -x dist/hexa-linux-x86_64/build/aprime_cc \
            || { echo "PACKAGING DEFECT: staged install lacks build/aprime_cc — the own-link default leg would clang-fallback on the consumer (stage_precompile_package r27 must hard-ship it on linux-x86_64)"; exit 1; }
          echo "aprime_cc present in staged install ✓"
      - name: (3) Reconstruct the install.sh consumer layout (build/ + self/ hxroot marker)
        shell: bash
        run: |
          set -euo pipefail
          # MEASURED (aiden): own-link resolves its native compiler + runtime.a from the
          # INSTALL layout, NOT the raw staging tarball. install.sh (a) extracts the tarball
          # to $HX_BIN, (b) symlinks $HX_BIN/self -> cloned source self/ so resolve_hxroot()
          # (self/main.hexa:1630) finds its marker `self/native/hexa_cc.c` and returns $HX_BIN
          # → resolve_prebuilt_runtime() resolves $HX_BIN/build/runtime.a, and resolve_native_cc()
          # resolves $HX_BIN/build/aprime_cc. The raw dist/ tarball lacks self/ → resolve_hxroot
          # falls to "." → runtime.a="" → own-link leg skips → clang delegate (a FALSE red). So
          # replicate install.sh's layout (the real consumer env) and census THAT.
          stage="$GITHUB_WORKSPACE/dist/hexa-linux-x86_64"
          HX_BIN=/tmp/hxinstall/bin; rm -rf /tmp/hxinstall; mkdir -p "$HX_BIN"
          cp "$stage/hexa" "$HX_BIN/hexa"
          cp -r "$stage/build" "$HX_BIN/build"
          ln -sfn "$GITHUB_WORKSPACE/self" "$HX_BIN/self"   # resolve_hxroot marker (install.sh:494)
          test -f "$HX_BIN/self/native/hexa_cc.c" \
            || { echo "install-layout DEFECT: $HX_BIN/self/native/hexa_cc.c missing — resolve_hxroot marker absent (release_build should have regenerated the emitted seed)"; exit 1; }
          echo "install layout ready: $HX_BIN (hexa + build/{aprime_cc,runtime.a} + self→marker)"
      - name: (4) cfallback-zero census against the INSTALL-LAYOUT hexa (neutral cwd · all env unset)
        shell: bash
        run: |
          set -uo pipefail
          # ALL of HEXA_APRIME_CC/HEXA_LANG/HEXA_PREBUILT_RUNTIME unset ⇒ own-link must
          # resolve everything from the install layout itself (argv0 + self/ marker), exactly
          # as a consumer whose shell carries none of these. Neutral cwd defeats the
          # ./build/aprime_cc cwd probe. This is the strictest faithful consumer model.
          mkdir -p /tmp/census-cwd && cd /tmp/census-cwd
          env -u HEXA_APRIME_CC -u HEXA_LANG -u HEXA_PREBUILT_RUNTIME \
            bash "$GITHUB_WORKSPACE/tool/cfallback_zero_census" --hexa /tmp/hxinstall/bin/hexa
