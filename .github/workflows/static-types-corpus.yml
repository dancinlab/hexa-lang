# static-types-corpus.yml — F1 corpus-clean ADVISORY census for the Wall A
# HEXA_STATIC_TYPES default-ON flip (state/static-types/wall_a_endgame.md §B.3 F1).
#
# PURPOSE
#   The static-types flip gate needs one axis no prior flip had: corpus-clean =
#   0 HX3011/HX3016/HX3017/HX3024 emissions over the FULL tracked .hexa corpus with
#   the flag ON (the checker REJECT-only changes which programs BUILD, not what
#   accepted programs emit). This job compiles the corpus front-end with
#   HEXA_STATIC_TYPES=1 (+HEXA_STATIC_TYPES_ARRAY_LOWER=1) and counts
#   HX3011/HX3016/HX3017/HX3024 diagnostic emissions per file. 0 total = corpus-clean proof
#   for the flip PR; >0 = either a true positive (fix the corpus code as an
#   ordinary PR first — the flip's value proof) or a checker false positive
#   (flip-blocking, cf. §F0 r9b coercion).
#
# ADVISORY — NEVER REQUIRED
#   continue-on-error: true. This workflow must never be added to branch
#   protection; it is a census signal, not a gate. A red here blocks nothing.
#
# FORWARD-COMPATIBLE
#   main today carries rungs r1–r6 (HEXA_STATIC_TYPES=1) only; the r7prep+
#   stack (#4457, HEXA_STATIC_TYPES_ARRAY_LOWER) is not yet merged. Both env
#   flags are exported unconditionally: unknown env vars are inert, so when
#   the stacked rungs land the same job simply exercises MORE checks with no
#   workflow change. HX3016/HX3017 are likewise grepped even though main may
#   emit only HX3011 today (HX3017 = r11 warn-band, forward-compatible).
#
# CORPUS (LANE B — full-corpus per-file sweep, wall_a_endgame §B.3 F1 / FLIP-1
#   census protocol state/static-types/flip1_census_protocol.md)
#   The prior sample was `find -maxdepth 1` (~69 files). This job now sweeps the
#   FULL tracked corpus — `git ls-files 'compiler/**/*.hexa' 'stdlib/**/*.hexa'
#   'self/**/*.hexa'` (~3,805: compiler 389 + stdlib 2,249 + self 1,167) — fanned
#   out `xargs -P $(nproc)` so 3.8k front-end runs stay inside budget. LANE B is
#   coverage-supporting/advisory (standalone-unparseable files false-clean via
#   resolve-death; never false-DIRTY), so a warn here informs but does not gate.
#
# BUILD (cheapest correct path — mirrors grace_consent.yml / build_selfhost.sh)
#   The typechecker lives in compiler/check/** and runs inside the driver
#   compiler/main.hexa, so the PR's checker source must be what executes.
#   Recipe: committed build/hexat_linux transpiles the flattened compiler
#   (tool/build_aprime.sh -v build/hexat_linux — the canonical stage-0 recipe;
#   its stage-0 regen restores frozen seeds + builds runtime.a on a clean
#   checkout) -> aprime_cc, a native driver that runs the FULL front-end
#   (parse -> resolve -> bind -> type_check) on each corpus file. FREE
#   ubuntu-latest runner ONLY — Blacksmith/larger paid runners are FORBIDDEN
#   (#4016 revert precedent).
#
# COST
#   Target < 25 min: one aprime build (~minutes) + FULL-corpus per-file front-end
#   runs — ~3,805 tracked .hexa (compiler 389 + stdlib 2,249 + self 1,167), fanned
#   out `xargs -P $(nproc)` (sub-second to seconds each, 15 s timeout guard per
#   file — slow-tail files SKIP fast: advisory undercount bias, never GO-block).
#   FREE ubuntu-latest only. Advisory, so a budget timeout blocks nothing.

name: static-types-corpus

on:
  pull_request:
    # TRADEOFF: the census now sweeps the FULL corpus (compiler/** + stdlib/** +
    # self/**), but the PR trigger is deliberately kept NARROW — only the checker
    # source, stdlib, and this workflow. Adding 'self/**' / 'compiler/**' here
    # would fire this advisory 3.8k-file job on far more PRs (self/ + all of
    # compiler/ churn) for no gate value — it never blocks. The full-corpus data
    # is harvested via workflow_dispatch (the FLIP-1 census run) and on the PRs
    # that already touch the checker/stdlib. Widen only if drift monitoring on
    # every self/ PR is wanted.
    paths:
      - 'compiler/check/**'
      - 'stdlib/**'
      - '.github/workflows/static-types-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a SUPERSEDED run only on PR re-push (mirrors the sibling gates);
  # dispatch runs always complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-census:
    name: static-types corpus census (HX3011/HX3016/HX3017/HX3024/HX3025/HX3053 · advisory)
    runs-on: ubuntu-latest      # FREE runner only — paid runners forbidden (#4016)
    timeout-minutes: 90         # full corpus (~3.8k files). Hxstory: 25-min cap killed run mid-xargs (no verdict); 60-min cap STILL killed it (run 28723070379 hit 60min16s with orphan aprime_cc per-file timeouts — a tail of slow stdlib files pegging the per-file 60s limit starves the fan). Fix = per-file timeout 60→15s (below) so the slow tail is SKIPPED fast (advisory undercount bias, cf. §LANE-B) instead of pegging a worker for 60s each; 90-min job cap gives margin over the now-bounded fan. Advisory (continue-on-error) — a timeout blocks nothing, but yields NO census data, which is why the cap must clear the real runtime.
    continue-on-error: true     # ADVISORY — never a required check
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # restore_frozen_seeds fetches the pinned frozen ref on demand; a
          # shallow checkout is fine (same as release-runtime-compile-gate).
          fetch-depth: 1

      - name: Build typechecker driver (aprime_cc via committed hexat_linux)
        id: build
        shell: bash
        env:
          # stage_resolve_runtime_a's edge-tarball probe uses gh when present
          # (frozen-seed source-build fallback otherwise) — same wiring as
          # grace_consent.yml.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          chmod +x build/hexat_linux
          # Canonical stage-0 recipe: flatten compiler/main.hexa closure ->
          # hexat transpile -> clang. stage-0 regen inside the script restores
          # the frozen runtime seeds + runtime.a on this clean checkout.
          rc=0
          bash tool/build_aprime.sh -o build/aprime_cc -v "$PWD/build/hexat_linux" || rc=$?
          if [ "$rc" -ne 0 ] || [ ! -x build/aprime_cc ]; then
            # Build infra failure is NOT a corpus verdict — report NEUTRAL, do
            # not fake a dirty/clean census. (Advisory job; exit 0 keeps the
            # signal unambiguous: red = real HX3011/HX3016/HX3017/HX3024 emissions only.)
            echo "::warning::static-types-corpus NEUTRAL — aprime_cc build failed (rc=$rc); corpus census NOT run (infra, not a corpus verdict)."
            echo "built=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=1" >> "$GITHUB_OUTPUT"
          echo "aprime_cc: $(wc -c < build/aprime_cc) bytes"

      - name: Census — real-source static-types diags over the corpus (HX3011/HX3016/HX3017/HX3024)
        if: ${{ steps.build.outputs.built == '1' }}
        shell: bash
        # FLIP-3 flagless: static-types is unconditional — no env to set.
        run: |
          # NB: -uo pipefail, NOT -e. A clean file greps 0 matches -> grep exits
          # 1; under `set -e` + pipefail that 1 propagated and crashed the very
          # first run (fixed 87bd65358). Every grep below stays guarded with
          # `|| true`, and the summary block ALWAYS prints before any nonzero
          # exit — a clean census must never crash the job.
          set -uo pipefail

          scratch="$(mktemp -d)"
          mkdir -p "$scratch/logs" "$scratch/asm" "$scratch/counts"

          # ── FULL tracked corpus (LANE B): compiler/** + stdlib/** + self/** ──
          # Was `find -maxdepth 1` (~69-file sample); now the whole tracked tree
          # (~3,805 files). Deterministic order (sort). git ls-files == tracked
          # only (no build artifacts, no untracked scratch).
          # FLIP-3: exclude byte-eq TEST FIXTURES (the _types_strict_for carve-out
          # set — *_test.hexa + compiler/test/**) so this census measures REAL
          # SHIPPING SOURCE only. Under flagless, fixtures stay Warning-band, but
          # a nonzero count HERE is the flip-guard alarm: real source must be
          # type-clean or the unconditional-ERROR default would brick the build.
          corpus_list="$scratch/corpus.txt"
          git ls-files \
              'compiler/**/*.hexa' \
              'stdlib/**/*.hexa' \
              'self/**/*.hexa' \
            | grep -vE '(_test\.hexa$|^compiler/test/)' \
            | sort > "$corpus_list"
          n_corpus="$(wc -l < "$corpus_list" | tr -d ' ')"
          echo "corpus: $n_corpus real-source files (fixtures excluded — matches _types_strict_for carve-out)"

          # ── per-file worker (fanned out below) ──────────────────────────────
          # Each file runs the identical front-end command, greps its OWN log for
          # HX3011/HX3016/HX3017/HX3024, and writes its count to $scratch/counts/<hash>.
          # Scratch names key on a PATH HASH (sha1), not basename: the full
          # corpus spans dirs, so basenames now collide (e.g. many `mod.hexa`) —
          # a basename-keyed .s/.log would clobber across the parallel fan.
          # shellcheck disable=SC2329  # invoked indirectly via `bash -c` (export -f)
          run_one() {
            f="$1"
            h="$(printf '%s' "$f" | sha1sum | cut -c1-16)"
            log="$scratch/logs/$h.log"
            # Front-end run: the driver renders ALL diagnostics (short format)
            # before codegen and exits nonzero on errors — rc is irrelevant to
            # the census, only the HX3011/HX3016/HX3017/HX3024 emission count is.
            # `_drv.hexa` is the positional driver-name shim (argv[1] slot), same
            # contract as tool/codegen_perf_budget.sh / control_singletu.sh.
            timeout 15 ./build/aprime_cc _drv.hexa \
                --emit=asm --target=x86_64-linux-gnu --error-format=short \
                -o "$scratch/asm/$h.s" "$f" > "$log" 2>&1 || true
            n="$( (grep -o -E 'HX30(1[167]|2[4-6]|3[03]|53)' "$log" || true) | wc -l | tr -d ' ')"
            # <count>\t<path> — path has no tabs; hash is the count-file name.
            printf '%s\t%s\n' "$n" "$f" > "$scratch/counts/$h"
          }
          export -f run_one
          export scratch

          # Parallel fan — 3,805 files serial would blow the budget. One file per
          # invocation (-I{}), $(nproc)-wide. Workers are self-guarded (|| true),
          # so a per-file timeout/crash never fails the fan.
          nproc_n="$(nproc 2>/dev/null || echo 2)"
          echo "fanning out over $nproc_n parallel workers…"
          xargs -a "$corpus_list" -P "$nproc_n" -I{} \
              bash -c 'run_one "$@"' _ {} || true

          # ── aggregate ───────────────────────────────────────────────────────
          total=0
          dirty_files=0
          ran=0
          summary=""
          shopt -s nullglob
          for cf in "$scratch"/counts/*; do
            ran=$((ran + 1))
            IFS=$'\t' read -r n f < "$cf" || true
            # Defensive: a truncated/empty count file counts as 0, never crash.
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            total=$((total + n))
            if [ "$n" -gt 0 ]; then
              dirty_files=$((dirty_files + 1))
              summary="$summary$f: $n%0A"
              echo "::notice file=$f::static-types corpus: $n HX3011/HX3016/HX3017/HX3024 emission(s) with HEXA_STATIC_TYPES=1"
              h="$(basename "$cf")"
              (grep -E 'HX301[167]' "$scratch/logs/$h.log" || true) | head -10 | sed "s|^|    $f: |"
            fi
          done

          echo ""
          echo "════ static-types corpus census ════"
          echo "files checked        : $ran"
          echo "dirty files          : $dirty_files"
          echo "HX3011/HX3016/HX3017/HX3024 : $total"

          if [ "$total" -eq 0 ]; then
            echo "::notice::static-types corpus CLEAN — 0 HX3011/HX3016/HX3017/HX3024 over $ran files (full corpus) with HEXA_STATIC_TYPES=1 (+ARRAY_LOWER). Corpus-clean proof for the default-ON flip (wall_a_endgame.md §B F1)."
            exit 0
          fi
          echo "::notice::static-types corpus DIRTY — $total HX3011/HX3016/HX3017/HX3024 emission(s) in $dirty_files/$ran files: %0A$summary(true positive -> fix the corpus code as an ordinary PR; false positive -> flip-blocking checker rung, cf. §F0 r9b)"
          # Advisory red (continue-on-error keeps it non-blocking).
          exit 1
