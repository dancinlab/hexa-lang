name: release

# Release build matrix — fires on tag push (`v*`), bootstraps the self-host
# pipeline on each runner, packages the resulting `hexa` + `build/` sidecar
# binaries as `hexa-<target>.tar.gz`, and uploads them to the GitHub Release
# that the tag created. `install.sh` fetches these assets verbatim:
#
#   https://github.com/dancinlab/hexa-lang/releases/download/<tag>/hexa-<target>.tar.gz
#
# Targets (install.sh detect_target — uname{-s,-m} → {darwin|linux}-{arm64|x86_64}):
#   · darwin-arm64    macos-latest         Apple Silicon
#   · linux-x86_64    ubuntu-latest
#   · linux-arm64     ubuntu-24.04-arm     GA-confirmed by bootstrap.yml
#
# Archive layout (install.sh L80-103):
#   hexa-<target>/
#     hexa                          # CLI binary (becomes ~/.hx/bin/hexa.real)
#     build/hexa_module_loader      # `hexa build` flatten helper
#     release/precompile/           # GO M4 — pre-built cache binaries (hexa_run.<key>)
#                                   # so first `hexa run <shipped-script>` skips clang fork
#
# The bootstrap chain is duplicated verbatim from bootstrap.yml to keep the
# two workflows independent (per bootstrap.yml's INDEPENDENCE clause).

on:
  push:
    tags: ['v*']
    branches: [main]      # → rolling `edge` prerelease (install via HEXA_VERSION=edge)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for'
        required: true

permissions:
  contents: write  # gh release upload + edge tag force-move

# Tag push (v*) keeps every run — distinct group per tag, no cancellation.
# Main push only ever needs the latest commit's edge build; cancel any
# older in-flight edge run when a newer main push lands.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CFLAGS_COMMON: "-O2 -std=gnu11 -D_GNU_SOURCE -Wno-trigraphs"

jobs:
  # ── Setup — decide release tag + force-move `edge` on main push ────
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.c.outputs.release_tag }}
      is_tag: ${{ steps.c.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v6

      - id: c
        name: Compute release_tag + is_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
              echo "release_tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
              echo "is_tag=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
              echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
              echo "release_tag=edge" >> "$GITHUB_OUTPUT"
              echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # softprops/action-gh-release@v2 will create-or-update the release
      # at the named tag, but it does NOT move an existing tag to a new
      # commit. For `edge` (rolling), force-move the git tag here so the
      # release's commit and the tag's commit stay in lock-step.
      - name: Force-move `edge` tag (main push only)
        if: steps.c.outputs.is_tag != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git tag -f edge "${{ github.sha }}"
          git push origin -f edge
  # ── macOS arm64 (Apple Silicon) ────────────────────────────
  release-macos-arm64:
    name: release (darwin-arm64)
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # ── .c=0 SINGLE-JOB-FAITHFUL refactor — the whole 0b→build sequence is now
      # ONE shared entry point (tool/release_build) that the faithful nobaseline
      # gate calls VERBATIM. Caller passes only TARGET/CC/LIBS/GH_TOKEN; every
      # per-stage env (EDGE_ASSET, HEXA_PREBUILT_RUNTIME, CFLAGS) is derived
      # INSIDE the script, so there is no per-stage env to drift. "gate green" ≡
      # "release green" by shared definition — not by static env comparison. The
      # 8 prior false-greens were all drift between two copies of these stages;
      # the copies are now eliminated. Seeds present today → byte-equivalent
      # no-op (Stage 0b rebuilds runtime.a from source).
      - name: Build — shared release_build (Stage 0b→0/1/2)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
          # ── N5 seed-convergence SHIP-BY-DEFAULT (edge-roll only) ──────────
          # Converge the bootstrap seed (self/native/hexa_cc.c) to its fixpoint
          # DURING the edge roll so the shipped build/hexat already lowers the
          # forge OFF-CUDA 4-arg dispatches (clm_prod) correctly — every
          # downstream `hx install` build inherits the converged hexat via the
          # edge tarball, with NO per-user HEXA_SEED_CONVERGE=1 opt-in. Scoped
          # to the release edge-build ONLY (NOT the shared tool/release_build,
          # NOT the faithful-nobaseline gate, which both keep the default OFF):
          # the gate edge-pulls the CURRENT edge (no-op prebuild) + runs the
          # determinism oracles, so convergence — a deterministic fixpoint —
          # flows through faithful unchanged. The converged edge ships on the
          # NEXT roll after this merges.
          HEXA_SEED_CONVERGE: "1"
          HEXA_BUILD_VERSION: ${{ needs.setup.outputs.release_tag }}
        run: bash tool/release_build

      # ── macOS Developer ID signing (GATED · skips cleanly when secrets
      # absent → release ships ad-hoc and install.sh strips quarantine +
      # re-signs locally on each Mac). Activate by adding repo secrets:
      #   MACOS_CERT_P12       base64 of a "Developer ID Application" .p12
      #   MACOS_CERT_PASSWORD  the .p12 export password
      #   MACOS_SIGN_IDENTITY  e.g. "Developer ID Application: NAME (TEAMID)"
      # Hardened runtime (--options runtime) is intentionally OFF: the driver
      # dlopen()s (forge/crypto), so enabling it needs entitlements
      # (allow-dyld-environment-variables · allow-jit · disable-library-
      # validation). Add an entitlements plist + flip the flag once verified
      # on a real notarization run. Developer ID signing is a prerequisite for
      # the notarize step after Package.
      - name: Stage 2b — Developer ID codesign (gated)
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # In-script gate: the `secrets` context is NOT allowed in a step-level
          # `if:` (GitHub rejects the whole workflow file). Guard on the
          # env-exported secret instead — skips cleanly when the cert is absent.
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "codesign: MACOS_CERT_P12 secret absent — skipping Developer ID signing"
            exit 0
          fi
          KC="$RUNNER_TEMP/hexa-sign.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" --identifier hexad hexa
          codesign --verify --verbose hexa
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Stage 2b — sign SKIP notice
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::notice::Developer ID signing SKIPPED (no MACOS_CERT_P12) — release ships ad-hoc; install.sh strips quarantine + re-signs locally per Mac."
          fi

      # ── Package — shared release_package (Stage 3 precompile + tarball). The
      # faithful nobaseline gate calls this VERBATIM. Split from release_build so
      # the Developer-ID sign/notarize steps (release-only, gated) interleave
      # between build and package. HEXA_PREBUILT_RUNTIME / HEXA_MAC_BUILD_OK are
      # derived inside the script from TARGET — no per-stage env to drift.
      - name: Package — shared release_package (Stage 3 + tarball)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
        run: bash tool/release_package

      # ── Notarize the tarball (GATED · requires the Developer ID signing step
      # above + secrets MACOS_NOTARY_APPLE_ID / MACOS_NOTARY_TEAM_ID /
      # MACOS_NOTARY_PASSWORD (app-specific password)). notarytool registers the
      # signed binary's cdhash with Apple so Gatekeeper passes online. Bare CLI
      # binaries can't be stapled (stapler only staples .app/.dmg/.pkg), so the
      # ticket is online-only — fine for `curl|bash` installs. Skips cleanly
      # when the secret is absent.
      - name: Notarize tarball (gated)
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_PASSWORD:-}" ]; then
            echo "notarize: MACOS_NOTARY_PASSWORD absent — skipping notarization"
            exit 0
          fi
          xcrun notarytool submit hexa-darwin-arm64.tar.gz \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          # all-3-green gate (v0.241.0/.1 lesson): each platform job uploads its
          # asset as a PRERELEASE and never marks Latest. The `finalize` job
          # promotes the tag to stable Latest ONLY after all three targets
          # succeed. If any target fails (e.g. arm64), the release stays
          # prerelease → install.sh's stable/latest resolution skips the
          # partial release instead of shipping a 2/3 asset set as Latest.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: hexa-darwin-arm64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Linux x86_64 ───────────────────────────────────────────
  release-linux-x86_64:
    name: release (linux-x86_64)
    needs: setup
    # glibc-floor (#3553-followup): build on ubuntu-22.04 (glibc 2.35), NOT
    # ubuntu-latest (24.04 → glibc 2.39). glibc is backward-compatible, so a
    # binary linked against 2.35 runs on 2.35 (22.04) AND 2.39 (24.04) — the
    # 24.04-built binary failed on 22.04 cloud pods with "GLIBC_2.38 not found".
    # 22.04 is the portability floor that covers current cloud images.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # ── .c=0 SINGLE-JOB-FAITHFUL refactor — see darwin-arm64 job. Linux calls
      # release_build then release_package back-to-back (no sign/notarize). Both
      # are the SAME shared entry points the faithful nobaseline gate runs.
      - name: Build — shared release_build (Stage 0b→0/1/2)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          # N5 seed-convergence SHIP-BY-DEFAULT (edge-roll only) — see the
          # darwin-arm64 job for the full rationale. Scoped to the release
          # edge-build; the shared release_build + faithful gate stay default-OFF.
          HEXA_SEED_CONVERGE: "1"
          HEXA_BUILD_VERSION: ${{ needs.setup.outputs.release_tag }}
        run: bash tool/release_build

      - name: Package — shared release_package (Stage 3 + tarball)
        shell: bash
        env:
          TARGET: linux-x86_64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
        run: bash tool/release_package

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          # all-3-green gate (v0.241.0/.1 lesson): each platform job uploads its
          # asset as a PRERELEASE and never marks Latest. The `finalize` job
          # promotes the tag to stable Latest ONLY after all three targets
          # succeed. If any target fails (e.g. arm64), the release stays
          # prerelease → install.sh's stable/latest resolution skips the
          # partial release instead of shipping a 2/3 asset set as Latest.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: hexa-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Linux arm64 ────────────────────────────────────────────
  release-linux-arm64:
    name: release (linux-arm64)
    needs: setup
    # arm64 runner = ubuntu-24.04-arm (glibc 2.39). NOTE: #3559 tried 22.04-arm
    # (glibc 2.35 floor, mirroring x86_64) but the stage-0 self-hosted transpiler
    # `hexa_v2` SIGSEGVs on the 22.04-arm toolchain while transpiling
    # module_loader.hexa → arm64 asset failed to publish in v0.241.0. 24.04-arm is
    # the GA-confirmed working runner (shipped through v0.240.0). The arm64 22.04
    # floor is deferred to the static-musl single-binary release (glibc-independent).
    # x86_64 keeps its 22.04 (2.35) floor — only arm64 reverts here.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # ── .c=0 SINGLE-JOB-FAITHFUL refactor — see darwin-arm64 job. Linux calls
      # release_build then release_package back-to-back. Same shared entry points
      # the faithful nobaseline gate runs verbatim.
      - name: Build — shared release_build (Stage 0b→0/1/2)
        shell: bash
        env:
          TARGET: linux-arm64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
          # N5 seed-convergence SHIP-BY-DEFAULT (edge-roll only) — see the
          # darwin-arm64 job for the full rationale. Scoped to the release
          # edge-build; the shared release_build + faithful gate stay default-OFF.
          HEXA_SEED_CONVERGE: "1"
          HEXA_BUILD_VERSION: ${{ needs.setup.outputs.release_tag }}
        run: bash tool/release_build

      - name: Package — shared release_package (Stage 3 + tarball)
        shell: bash
        env:
          TARGET: linux-arm64
          CC: gcc
          LIBS: "-lm -ldl"
          GH_TOKEN: ${{ github.token }}
        run: bash tool/release_package

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          # all-3-green gate (v0.241.0/.1 lesson): each platform job uploads its
          # asset as a PRERELEASE and never marks Latest. The `finalize` job
          # promotes the tag to stable Latest ONLY after all three targets
          # succeed. If any target fails (e.g. arm64), the release stays
          # prerelease → install.sh's stable/latest resolution skips the
          # partial release instead of shipping a 2/3 asset set as Latest.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: hexa-linux-arm64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Linux x86_64 STATIC-MUSL (ING #2 — edge-only supplementary asset) ──────
  # A glibc-FREE single static ELF so consumers (anima/…) install on ANY pod OS
  # regardless of the host glibc floor (no more `GLIBC_2.xx not found` on old/musl
  # pods). Built with x86_64-linux-musl-gcc + `-static`, runtime linked from SOURCE
  # (HEXA_PREBUILT_RUNTIME unset → each stage compiles self/runtime.c, which the
  # ING #2 post-restore header-hoist patch in tool/restore_frozen_seeds makes
  # musl-portable; glibc-byteeq-inert). PROVEN on pool/aiden: full ./hexa driver →
  # 2.5MB statically-linked ELF, `ldd` = "not a dynamic executable", `--version` OK.
  #
  # SUPPLEMENTARY + EDGE-FIRST: this job is NOT in `finalize`'s needs list, so it
  # NEVER gates the stable 3-green promotion — it ships an EXTRA prerelease asset
  # `hexa-linux-x86_64-musl.tar.gz` alongside the existing 3 targets. The existing
  # glibc `hexa-linux-x86_64.tar.gz` is UNCHANGED (additive target, not a replace).
  # install.sh's static-musl preference is a separate change (see ING #2 notes).
  release-linux-x86_64-musl:
    name: release (linux-x86_64-musl · static · edge)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install musl cross toolchain
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev
          # ubuntu's musl-tools ships /usr/bin/musl-gcc (x86_64). The build scripts
          # expect a `x86_64-linux-musl-gcc` name → symlink it if absent.
          if ! command -v x86_64-linux-musl-gcc >/dev/null 2>&1; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc
          fi
          x86_64-linux-musl-gcc --version | head -1

      # Static-musl link from SOURCE runtime — HEXA_PREBUILT_RUNTIME is left UNSET
      # so every stage compiles self/runtime.c (musl-portable via ING #2 patch)
      # rather than a glibc-compiled runtime.a. LIBS carries `-static` so the final
      # ./hexa + every intermediate links statically.
      - name: Build — shared release_build (static musl, source runtime)
        shell: bash
        env:
          TARGET: linux-x86_64-musl
          CC: x86_64-linux-musl-gcc
          LIBS: "-static -lm"
          # Drop the optional OpenSSL/libsodium binds — a `-static` musl link has
          # no host glibc shared libs to satisfy `-lssl -lcrypto`/`-lsodium`
          # (os_clang_cflags/ldflags honor this; the crypto stubs return errors).
          HEXA_STATIC_DEPS: "1"
          GH_TOKEN: ${{ github.token }}
          HEXA_SEED_CONVERGE: "1"
          HEXA_BUILD_VERSION: ${{ needs.setup.outputs.release_tag }}
        run: |
          unset HEXA_PREBUILT_RUNTIME
          bash tool/release_build

      - name: Package — shared release_package (static musl tarball)
        shell: bash
        env:
          TARGET: linux-x86_64-musl
          CC: x86_64-linux-musl-gcc
          LIBS: "-static -lm"
          HEXA_STATIC_DEPS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          unset HEXA_PREBUILT_RUNTIME
          bash tool/release_package

      - name: Verify static (no dynamic deps)
        shell: bash
        run: |
          BIN=dist/hexa-linux-x86_64-musl/hexa
          file "$BIN"
          # CAPTURE first, then grep. `ldd <static-bin>` exits non-zero (and the
          # `-q` short-circuit can SIGPIPE it), which under the default
          # `bash -e -o pipefail` shell would make `ldd … | grep -q` fail the
          # pipeline even when the match is present (false-positive "dynamically
          # linked"). `|| true` keeps the non-zero exit from tripping `-e`; we
          # judge linkage from the captured text + `file` output instead.
          LDD_OUT="$(ldd "$BIN" 2>&1 || true)"
          FILE_OUT="$(file "$BIN")"
          echo "$LDD_OUT"
          if printf '%s\n' "$LDD_OUT" | grep -qiE 'not a dynamic executable|동적 실행' \
             || printf '%s\n' "$FILE_OUT" | grep -qiE 'statically linked'; then
            echo "✓ statically linked — no glibc dependency"
          else
            echo "✗ binary is dynamically linked — static-musl build regressed" >&2
            exit 1
          fi

      - name: Upload to GitHub Release (supplementary edge asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: hexa-linux-x86_64-musl.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Linux arm64 STATIC-MUSL (ING #2 r2 — edge-only supplementary asset) ────
  # The arm64 half of the static-musl target. release-linux-arm64 above runs on
  # ubuntu-24.04-arm (glibc 2.39) and DEFERS the arm64 glibc-floor problem here:
  # arm64 cloud pods on glibc < 2.39 die with `GLIBC_2.xx not found` on the
  # dynamic asset. This job ships a glibc-FREE single static ELF that runs on ANY
  # arm64 pod OS regardless of host glibc floor (or pure-musl Alpine-arm64).
  #
  # Built NATIVELY on ubuntu-24.04-arm (NOT cross-compiled — aiden/summer are
  # x86_64 and can't build arm64-musl natively; this is the only zero-cost arm64
  # build surface). Ubuntu's `musl-tools` on an arm64 host ships an aarch64-native
  # `/usr/bin/musl-gcc`; we symlink it to `aarch64-linux-musl-gcc` (the name the
  # build scripts expect via $CC). Runtime linked from SOURCE (HEXA_PREBUILT_RUNTIME
  # unset → each stage compiles self/runtime.c, musl-portable via the ING #2
  # post-restore header-hoist patch in tool/restore_frozen_seeds; glibc-byteeq-inert).
  #
  # SUPPLEMENTARY + EDGE-FIRST: NOT in `finalize`'s needs list, so it NEVER gates
  # the stable 3-green promotion — it ships an EXTRA prerelease asset
  # `hexa-linux-arm64-musl.tar.gz` alongside the existing targets. The dynamic
  # glibc `hexa-linux-arm64.tar.gz` is UNCHANGED (additive target, not a replace).
  release-linux-arm64-musl:
    name: release (linux-arm64-musl · static · edge)
    needs: setup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install musl toolchain (aarch64-native)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev
          # On an arm64 host, ubuntu's musl-tools ships an aarch64-native
          # /usr/bin/musl-gcc. The build scripts expect `aarch64-linux-musl-gcc`
          # → symlink it if absent (mirrors the x86_64-musl job's symlink).
          if ! command -v aarch64-linux-musl-gcc >/dev/null 2>&1; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          fi
          aarch64-linux-musl-gcc --version | head -1

      # Static-musl link from SOURCE runtime — HEXA_PREBUILT_RUNTIME left UNSET so
      # every stage compiles self/runtime.c (musl-portable via ING #2 patch). LIBS
      # carries `-static` so the final ./hexa + every intermediate links statically.
      - name: Build — shared release_build (static musl, source runtime)
        shell: bash
        env:
          TARGET: linux-arm64-musl
          CC: aarch64-linux-musl-gcc
          LIBS: "-static -lm"
          # Drop optional OpenSSL/libsodium binds — a `-static` musl link has no
          # host glibc shared libs to satisfy `-lssl -lcrypto`/`-lsodium`.
          HEXA_STATIC_DEPS: "1"
          GH_TOKEN: ${{ github.token }}
          HEXA_SEED_CONVERGE: "1"
          HEXA_BUILD_VERSION: ${{ needs.setup.outputs.release_tag }}
        run: |
          unset HEXA_PREBUILT_RUNTIME
          bash tool/release_build

      - name: Package — shared release_package (static musl tarball)
        shell: bash
        env:
          TARGET: linux-arm64-musl
          CC: aarch64-linux-musl-gcc
          LIBS: "-static -lm"
          HEXA_STATIC_DEPS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          unset HEXA_PREBUILT_RUNTIME
          bash tool/release_package

      - name: Verify static (no dynamic deps)
        shell: bash
        run: |
          BIN=dist/hexa-linux-arm64-musl/hexa
          file "$BIN"
          # CAPTURE first, then grep — `ldd <static-bin>` exits non-zero and a
          # `-q` short-circuit can SIGPIPE it, which under `bash -e -o pipefail`
          # would fail the pipeline even on a present match. `|| true` keeps the
          # non-zero exit from tripping `-e`; judge linkage from text + `file`.
          LDD_OUT="$(ldd "$BIN" 2>&1 || true)"
          FILE_OUT="$(file "$BIN")"
          echo "$LDD_OUT"
          # Capture --version proof (verify bar c2).
          "$BIN" --version || true
          if printf '%s\n' "$LDD_OUT" | grep -qiE 'not a dynamic executable|동적 실행' \
             || printf '%s\n' "$FILE_OUT" | grep -qiE 'statically linked'; then
            echo "✓ statically linked — no glibc dependency"
          else
            echo "✗ binary is dynamically linked — static-musl build regressed" >&2
            exit 1
          fi

      - name: Upload to GitHub Release (supplementary edge asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: hexa-linux-arm64-musl.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Linux x86_64 CUDA (ing-cuda-release — edge-only supplementary asset) ──────
  # A cuBLAS-enabled hexa so consumers (anima #2386) install a prebuilt GPU build
  # instead of a CPU-only one (the shipped install.sh hexa reports
  # cuda_available()==0 — #3674). The CUDA runtime objects (runtime_cuda.o +
  # the nvcc -dlink device blob) fold into the shipped build/runtime.a
  # (stage_resolve_runtime_a's resolve_cuda_runtime_seed, gated HEXA_CUDA=1), and
  # os_clang_ldflags' HEXA_CUDA branch adds -lcudart/-lcublas/-lcuda/-lcudadevrt
  # so a consumer `hexa build`/`run` program links cuBLAS. The hexa binary ITSELF
  # also links runtime.a-with-cuda, so its LIBS carries the cuBLAS libs too.
  #
  # GPU-LESS CI: the GitHub runner has nvcc + cuBLAS headers/libs (Jimver/cuda-
  # toolkit) but NO GPU — the job COMPILES + LINKS cuBLAS GREEN but CANNOT run a
  # GPU GEMM. That is fine: the GPU-vs-CPU 15-25× verdict + cuda_available()==1
  # was proven on the pool host aiden (RTX 5070) in #3680 — aiden is the GPU-
  # verify authority. CI here = build + link + upload only.
  #
  # SUPPLEMENTARY + EDGE-FIRST: NOT in `finalize`'s needs list, so it NEVER gates
  # the stable 3-green promotion — it ships an EXTRA prerelease asset
  # `hexa-linux-x86_64-cuda.tar.gz` alongside the 3 default targets. The default
  # glibc `hexa-linux-x86_64.tar.gz` is UNCHANGED (additive; self-host ≠ release
  # ABSOLUTE). install.sh selects this asset only on HEXA_CUDA=1 opt-in (never
  # auto-prefers it — cuBLAS dep + GPU assumption).
  release-linux-x86_64-cuda:
    name: release (linux-x86_64-cuda · cuBLAS · edge)
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      # CUDA toolkit (nvcc + cuBLAS headers/libs) on the GPU-LESS runner — Jimver
      # action installs a full toolkit (network sub-packages, no driver/GPU). The
      # cuBLAS dev libs ship in the toolkit, so the link resolves -lcublas/-lcudart.
      - name: Install CUDA toolkit (nvcc + cuBLAS, build-only · no GPU)
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: '12.6.2'
          method: 'network'
          # `sub-packages` prepends `cuda-` (→ cuda-nvcc-12-6, cuda-cudart-12-6,
          # cuda-cudart-dev-12-6) — those resolve. cuBLAS is the exception: the
          # NVIDIA cuda-ubuntu2204 repo ships it as `libcublas-12-6` /
          # `libcublas-dev-12-6` (NO `cuda-` prefix), so `cublas`/`cublas-dev` in
          # sub-packages mapped to the nonexistent `cuda-cublas-12-6` →
          # "E: Unable to locate package" (Jimver issue #371). cuBLAS therefore
          # goes through `non-cuda-sub-packages` (no prefix → libcublas-12-6).
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Probe CUDA toolkit (build-only — no GPU on CI)
        shell: bash
        run: |
          set -euo pipefail
          echo "CUDA_PATH=${CUDA_PATH:-<unset>}  (toolkit version ${{ steps.cuda-toolkit.outputs.cuda }})"
          nvcc --version | grep -i release
          # cuBLAS dev libs must be present for the link (no GPU needed to link).
          find "${CUDA_PATH:-/usr/local/cuda}" \( -name 'libcublas*' -o -name 'libcudart*' \) 2>/dev/null | head
          # `-lcuda` (CUDA driver API) resolves against the toolkit's build-only
          # stub on a GPU-less runner — assert the stub exists so a toolkit layout
          # change is caught here (fail-loud) rather than deep in the link.
          CUDA_HOME="${CUDA_PATH:-/usr/local/cuda}"
          STUB_DIR="$CUDA_HOME/targets/x86_64-linux/lib/stubs"
          [ -d "$STUB_DIR" ] || STUB_DIR="$CUDA_HOME/lib64/stubs"
          if [ -f "$STUB_DIR/libcuda.so" ]; then
            echo "✓ libcuda.so driver stub present: $STUB_DIR/libcuda.so"
          else
            echo "✗ libcuda.so driver stub NOT found under $STUB_DIR — -lcuda link will fail" >&2
            find "$CUDA_HOME" -name 'libcuda.so*' 2>/dev/null | head
            exit 1
          fi

      # Build with HEXA_CUDA=1: stage_resolve_runtime_a folds runtime_cuda.o +
      # runtime_cuda_dlink.o into runtime.a + compiles runtime.c -DHEXA_CUDA; the
      # hexa binary's own link (stage_build_hexa `$RT_ARG $LIBS`) needs the cuBLAS
      # libs too, so LIBS carries them. SM=75 is the build-time -gencode arch
      # (Turing) — a forward-compatible PTX/sass floor for the relocatable device
      # code; the actual GPU arch is the consumer's at run time (cuBLAS is arch-
      # agnostic at the host API). HEXA_PREBUILT_RUNTIME unset → runtime.a built
      # fresh with the CUDA fold. CUDA_HOME → the toolkit the action installed.
      - name: Build — shared release_build (CUDA runtime.a, cuBLAS link)
        shell: bash
        env:
          TARGET: linux-x86_64-cuda
          CC: gcc
          LIBS: "-lm -ldl -lcudart -lcublas -lcuda -lcudadevrt"
          HEXA_CUDA: "1"
          SM: "75"
          GH_TOKEN: ${{ github.token }}
          HEXA_SEED_CONVERGE: "1"
          HEXA_BUILD_VERSION: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail
          export CUDA_HOME="${CUDA_PATH:-/usr/local/cuda}"
          # The cuBLAS/cudart shared libs live under the toolkit lib dir; add it to
          # LIBS' search path so the hexa binary's link finds -lcudart/-lcublas.
          CUDA_LIB="$CUDA_HOME/targets/x86_64-linux/lib"
          [ -d "$CUDA_LIB" ] || CUDA_LIB="$CUDA_HOME/lib64"
          # `-lcuda` is the CUDA *driver* API (libcuda.so) — it is NOT shipped by
          # the cudart/cuBLAS runtime packages, only by the NVIDIA driver. A GPU-
          # less CI runner has no driver, so libcuda.so lives ONLY in the toolkit's
          # `stubs/` dir (a link-time stub; the real driver resolves at run time on
          # the consumer's GPU host). Add stubs/ to the search path so the build-
          # only link of `-lcuda` resolves (else `ld: cannot find -lcuda`).
          export LIBS="-L$CUDA_LIB -L$CUDA_LIB/stubs $LIBS"
          unset HEXA_PREBUILT_RUNTIME
          bash tool/release_build

      - name: Package — shared release_package (CUDA tarball)
        shell: bash
        env:
          TARGET: linux-x86_64-cuda
          CC: gcc
          LIBS: "-lm -ldl -lcudart -lcublas -lcuda -lcudadevrt"
          HEXA_CUDA: "1"
          SM: "75"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CUDA_HOME="${CUDA_PATH:-/usr/local/cuda}"
          CUDA_LIB="$CUDA_HOME/targets/x86_64-linux/lib"
          [ -d "$CUDA_LIB" ] || CUDA_LIB="$CUDA_HOME/lib64"
          # stubs/ supplies the build-only libcuda.so driver stub (see Build step).
          export LIBS="-L$CUDA_LIB -L$CUDA_LIB/stubs $LIBS"
          unset HEXA_PREBUILT_RUNTIME
          bash tool/release_package

      - name: Verify CUDA fold (runtime.a carries cuda objects · build-only)
        shell: bash
        run: |
          set -euo pipefail
          RA="dist/hexa-linux-x86_64-cuda/build/runtime.a"
          [ -f "$RA" ] || { echo "✗ $RA missing — CUDA package regressed" >&2; exit 1; }
          MEMBERS="$(ar t "$RA")"
          echo "$MEMBERS"
          # The two nvcc objects MUST be in the shipped runtime.a — else the
          # consumer link has no device code (silent CPU fallback). This is the CI
          # build-only depletion check (GPU run deferred to aiden #3680).
          if printf '%s\n' "$MEMBERS" | grep -q 'runtime_cuda.o' \
             && printf '%s\n' "$MEMBERS" | grep -q 'runtime_cuda_dlink.o'; then
            echo "✓ runtime.a carries runtime_cuda.o + runtime_cuda_dlink.o (cuBLAS-enabled)"
          else
            echo "✗ runtime.a is missing the CUDA objects — resolve_cuda_runtime_seed did not fold (CPU fallback shipped)" >&2
            exit 1
          fi
          # The hexa binary linked cuBLAS — confirm the dynamic deps (build-only;
          # a GPU is not needed to inspect the link).
          BIN="dist/hexa-linux-x86_64-cuda/hexa"
          if ldd "$BIN" 2>&1 | grep -iqE 'cublas|cudart'; then
            echo "✓ hexa links libcublas/libcudart"
          else
            echo "::warning::hexa ldd shows no cublas/cudart (lazy-bound?) — runtime.a fold is the authoritative check"
          fi

      - name: Upload to GitHub Release (supplementary edge asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: hexa-linux-x86_64-cuda.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ── Finalize — all-3-green gate (promote tag to stable Latest) ──────
  # `needs` lists all three platform jobs, so GitHub skips this job unless
  # EVERY target succeeded (a failed/skipped dependency skips finalize). Only
  # then is the release flipped from prerelease → stable + marked Latest. This
  # is the mechanical enforcement of the [릴리스 채널 규율] rule in CLAUDE.md:
  # stable ships only when x86_64 · arm64 · darwin are ALL green (3/3 assets).
  # Edge (branch push, is_tag != true) stays a rolling prerelease — finalize is
  # gated off — so `HEXA_VERSION=edge` consumers keep getting every main push.
  finalize:
    name: finalize (all-3-green → stable Latest)
    needs: [setup, release-macos-arm64, release-linux-x86_64, release-linux-arm64]
    if: needs.setup.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Promote release to stable Latest (3/3 assets confirmed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
