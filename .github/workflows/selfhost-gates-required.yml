# selfhost-gates-summary — the SINGLE always-on required check for SELFHOST-CI.
#
# Unlike the six path-filtered gate workflows (which can NOT be required without
# deadlocking PRs that don't touch self/** | compiler/**), this workflow runs on
# EVERY pull_request with NO path filter, so it ALWAYS reports a status and is
# safe to mark as a required branch-protection check. It enforces the hermetic
# shim-integrity gate (real on any host) + gate-script presence/syntax, and
# upgrades to inline native-emit enforcement on a SELFHOST_SLOT_READY runner.
name: selfhost-gates-summary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-evaluate AFTER the path-filtered own-link behavioral smoke concludes — the
  # aggregator (ubuntu, ~seconds) otherwise finishes while the smoke (self-hosted,
  # up to 45 min) is still in-progress, so section [4] would only ever see null.
  # This second run resolves the smoke's real conclusion for the same head SHA.
  workflow_run:
    workflows: [nobaseline-gate]
    types: [completed]

permissions:
  contents: read
  checks: read

concurrency:
  group: selfhost-gates-summary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # main push runs are NOT cancelled — supersede-cancel on the serial darwin runner left required-gate history holes (anima run 28651287277 precedent, 2026-07-03); PR runs still cancel-on-supersede like every sibling selfhost gate

jobs:
  selfhost-gates-summary:
    name: selfhost-gates-summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SELFHOST_SLOT_READY: ${{ vars.SELFHOST_SLOT_READY || '0' }}
      # section [4] own-link behavioral smoke check-run query (fail-open):
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
      - name: selfhost gates summary (always-on required aggregator)
        shell: bash
        run: bash tool/selfhost_gates_summary.sh
