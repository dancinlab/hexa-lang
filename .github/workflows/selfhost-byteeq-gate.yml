name: selfhost-byteeq-gate

# ── SELF-HOST BYTE-EQ FIXPOINT regression gate ──────────────────────────────
#
# PURPOSE
#   Lock the self-host byte-eq graduation into standing CI so a codegen/linker
#   edit can't silently regress it. The graduation proof: the graduated native
#   `gen2_fix` compiler re-emits the FULL flattened compiler to a byte-identical
#   object across generations — cmp cc-prc2-fix.o == cc-gen3.o == cc-gen4.o, all
#   exit 0 (3,224,592 bytes each, on the ghost macOS host).
#
# WHAT IT DOES
#   1. Builds the native `./hexa` driver via the SAME shared release path the
#      miscompile-zero + determinism gates use (tool/release_build).
#   2. Runs tool/selfhost_byteeq_gate.sh:
#        LEG A — re-emit gen3 → gen4 from the graduated gen2_fix over the exact
#                flattened source, cmp byte-identical (FIRSTDIFF=0), 0 ENCODE-MISS.
#        LEG B — fast native-codegen probe: c1_hex_literal (0xff->255) +
#                c2_stack_locals (STP/[sp]) emit clean (0 ENCODE-MISS).
#
#   Same exit-2-neutral classification as the sister gates (#2547): a CI runner
#   that lacks the graduated gen2_fix cannot native-emit → the script's canary
#   exits 2 (SETUP/INFRA) and we map it to neutral-success so a build-floor
#   hiccup never false-fails a PR. A TRUE regression (object produced but gen3
#   != gen4, or an ENCODE-MISS) still exits 1 and fails the job.
#
#   The proven reference run is on the ghost macOS host with the graduated
#   gen2_fix compiler:
#     HEXA_NATIVE_CC=~/dancinlab/selfhost-work/gen2_fix \
#       bash tool/selfhost_byteeq_gate.sh
#   (LEG A's heavy fixpoint needs the graduated flat source in selfhost-work;
#   absent that, LEG B still gates the codegen floor and the script PASSes
#   probe-only.)

on:
  push:
    branches: [main]
    paths:
      - 'self/test/miscompile_zero/**'
      - 'tool/selfhost_byteeq_gate.sh'
      - '.github/workflows/selfhost-byteeq-gate.yml'
      - 'compiler/**'
      - 'self/**'
  pull_request:
    paths:
      - 'self/test/miscompile_zero/**'
      - 'tool/selfhost_byteeq_gate.sh'
      - '.github/workflows/selfhost-byteeq-gate.yml'
      - 'compiler/**'
      - 'self/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a SUPERSEDED run only on PR re-push (a newer PR run replaces it and
  # supplies the fresh required check); push/dispatch runs always complete so
  # main's required-gate history stays intact. Frees runner minutes + shortens
  # the PR queue on rapid re-pushes. Byteeq-inert (cancels stale work; never
  # changes a build's inputs/outputs).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── dispatch — fallback-dispatch runner picker (free · always available) ─────
  # Probes whether ghost-selfhost (darwin arm64, gen2_fix slot) is ONLINE and
  # emits the darwin job's `runs-on` at runtime: ghost when online + same-repo
  # (fast, and — holding the graduated slot — the gate runs REAL instead of the
  # exit-2 NEUTRAL it takes on a slot-less cloud host), else the free GitHub-
  # hosted macos-15 fallback. Ghost-offline (or a fork PR) therefore NEVER wedges
  # this gate — it just falls back to macos-15. Mirrors the linux picker in
  # nobaseline-gate.yml 1:1 (tool/ci_pick_runner.sh · .github/actions/pick-runner).
  dispatch:
    name: dispatch (pick runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      darwin_label: ${{ steps.darwin.outputs.label }}
    steps:
      - uses: actions/checkout@v6
      - id: darwin
        uses: ./.github/actions/pick-runner
        with:
          kind: darwin
          # self-hosted only for same-repo events; fork PRs → GitHub-hosted (RCE).
          eligible: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          # administration:read PAT (self-hosted runners list needs it; the
          # default github.token CANNOT carry that scope → empty list → blind
          # fallback). Absent secret → `|| github.token` = today's harmless
          # macos-15 fallback; present → routing goes live. See PR/root-cause.
          token: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}

  selfhost-byteeq-gate:
    name: selfhost byte-eq (re-emit gen3→gen4, darwin-arm64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.darwin_label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Free CI accelerator: ccache the per-TU compiles (byteeq-safe — HEXA_CCACHE
      # only reroutes the compile through the cache, never the link/emit bytes).
      - name: ccache setup
        uses: ./.github/actions/ccache-setup

      - name: Build — shared release_build (native ./hexa driver)
        shell: bash
        env:
          TARGET: darwin-arm64
          CC: clang
          LIBS: ""
          GH_TOKEN: ${{ github.token }}
          HEXA_CCACHE: "1"
        run: bash tool/release_build

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      - name: Sanity — ./hexa runs
        shell: bash
        run: |
          set -euo pipefail
          ./hexa --version
          # #4214 forge-det builtin compile-smoke — set_deterministic/is_deterministic
          # MUST compile on the from-source hexa (latent-regression guard for the FFI/
          # C-ABI name collision that made the canonical determinism surface uncompilable
          # with no test exercising it). Verifies compilation+run, not det values
          # (set_deterministic is a no-op on this non-CUDA CI build).
          ./hexa run test/native_build/forge_det_builtin_smoke.hexa
          # P1a (#4339-fix) forge_dispatch_layernorm consumer-compile smoke — the
          # 7-arg device-LN builtin MUST lower to hexa_forge_dispatch_layernorm +
          # link. #4339 placed its codegen binding in the len==3 block (unreachable
          # for a 7-arg call) → consumer undefined-function; byteeq passed (self/
          # never calls it → inert). This CALLS it so a green-but-broken binding
          # can't ship again. Non-CUDA build → rc -1 (host fallback); reaching PASS
          # = the binding lowers+links. SSOT: convergence codegen-hexa-1.
          ./hexa run test/native_build/forge_layernorm_builtin_smoke.hexa
          # P2 (device-resident decode) farr_attn_dt_decode_gpu consumer-compile
          # smoke — the 9-arg single-query KV-decode attention builtin MUST lower
          # (bare-name fallthrough, same seam as farr_attn_dt_fwd_gpu) to a declared
          # symbol + link. Same latent-break class as forge_layernorm (#4339):
          # byteeq passes (self/ never calls it → inert) even if the runtime.h
          # proto / carrier is broken. This CALLS it so a green-but-broken wiring
          # can't ship. Non-CUDA build → CPU mirror (rc 0); reaching PASS = the
          # bare-name lowering + carrier link. SSOT: convergence codegen-hexa-1.
          ./hexa run test/native_build/forge_attn_decode_builtin_smoke.hexa
          # lever3 (#21 P2 launch-bound amortizer) farr_attn_dt_decode_batch_gpu
          # consumer-compile smoke — the 11-arg batched KV-decode attention builtin
          # (N independent single-query attentions in ONE launch) MUST lower (same
          # bare-name fallthrough seam as farr_attn_dt_decode_gpu) to a declared
          # symbol + link. Same latent-break class (#4339/#4285): byteeq passes
          # (self/ never calls it → inert) even if the proto/carrier is broken.
          # This CALLS it so a green-but-broken wiring can't ship. Non-CUDA build →
          # CPU mirror (rc 0); reaching PASS = bare-name lowering + carrier link.
          # SSOT: convergence codegen-hexa-1.
          ./hexa run test/native_build/forge_attn_decode_batch_builtin_smoke.hexa
          # LLM-path forge_dispatch_rmsnorm(_bwd) consumer-compile smoke — the
          # 6-arg fwd + 8-arg bwd device-RMSNorm builtins MUST lower (len==6 /
          # len==8 codegen blocks) to hexa_forge_dispatch_rmsnorm(_bwd) + link.
          # Same latent-break class as forge_layernorm (#4339): byteeq passes
          # (self/ never calls them -> inert) even if a binding is misplaced /
          # the proto is broken. This CALLS both so a green-but-broken wiring
          # can never ship. Non-CUDA build -> rc -1 (host fallback); reaching
          # PASS = both lower + link. SSOT: convergence codegen-hexa-1.
          ./hexa run test/native_build/forge_rmsnorm_builtin_smoke.hexa

      # ── Gate invocation ──────────────────────────────────────────────────
      # Same root cause as miscompile-zero-gate / determinism-gate: the released
      # `./hexa`'s `run compiler/main.hexa` recompiles against its embedded
      # runtime and hits the build-floor staleness wall, so every --emit=obj is
      # 0-byte in CI. Only the graduated gen2_fix (ghost host) native-emits
      # cleanly. So here the canary detects "cannot native-emit" and the gate
      # exits 2 (SETUP/INFRA) → we remap to neutral. Override HEXA_NATIVE_CC
      # (e.g. a future self-host gen2 build step or a self-hosted runner that
      # holds gen2_fix) to actually run the byte-eq legs in CI.
      - name: Gate — self-host byte-eq fixpoint + codegen probe
        shell: bash
        env:
          HEXA_NATIVE_CC: ${{ vars.HEXA_NATIVE_CC || './hexa' }}
          HEXA_TARGET: arm64-apple-darwin
          BYTEEQ_OUT: ${{ runner.temp }}/selfhost-byteeq-out
        run: |
          set -uo pipefail
          # GitHub's default step shell runs with `-e`, so a nonzero exit would
          # ABORT before the exit-2 remap. Capture rc with `|| rc=$?`.
          rc=0
          bash tool/selfhost_byteeq_gate.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::selfhost-byteeq-gate NEUTRAL (exit 2) — this CI env cannot native-emit (no graduated gen2_fix). The self-host byte-eq floor is NOT broken; gate passes neutral."
            exit 0
          fi
          exit "$rc"
