name: selfhost-native-build-gate

# ── `hexa build` NATIVE PATH regression gate ────────────────────────────────
#
# PURPOSE
#   Lock the "full native hexa build end-to-end" capability into standing CI:
#   `hexa build <prog.hexa> -o OUT` must produce a WORKING native executable via
#   the self-hosted gen3 (--emit=obj direct object) + hexa_ld (native link
#   against rt.o) — ZERO clang / ZERO system ld on the build path. The
#   hx-selfhost-cli launcher's `build` block (native-first, delegate-fallback)
#   is what this exercises, across a feature corpus (arith/string/loop/fn/
#   cond/array), so a regression that silently drops to clang/garbage FAILS the
#   PR instead of rotting unnoticed. verdict F-SELFHOST-NATIVE-BUILD-FLIP.
#
#   Same exit-2-neutral classification as the sister self-host gates: a CI
#   runner without a promoted self-host slot (gen3/hexa_ld/rt.o) cannot drive
#   the native build path → the gate exits 2 (SETUP/INFRA) and we remap to
#   neutral, so a missing slot never false-fails a PR. A TRUE regression (a
#   corpus program failed to build natively, or wrong output) exits 1 and fails.

on:
  push:
    branches: [main]
    paths:
      - 'tool/hx-selfhost-cli'
      - 'tool/selfhost_native_build_gate'
      - '.github/workflows/selfhost-native-build-gate.yml'
      - 'compiler/**'
      - 'self/**'
  pull_request:
    paths:
      - 'tool/hx-selfhost-cli'
      - 'tool/selfhost_native_build_gate'
      - '.github/workflows/selfhost-native-build-gate.yml'
      - 'compiler/**'
      - 'self/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a SUPERSEDED run only on PR re-push (a newer PR run replaces it and
  # supplies the fresh required check); push/dispatch runs always complete so
  # main's required-gate history stays intact. Frees runner minutes + shortens
  # the PR queue on rapid re-pushes. Byteeq-inert (cancels stale work; never
  # changes a build's inputs/outputs).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── dispatch — fallback-dispatch runner picker (free · always available) ─────
  # Probes whether ghost-selfhost (darwin arm64, gen2_fix slot) is ONLINE and
  # emits the darwin job's `runs-on` at runtime: ghost when online + same-repo
  # (fast, and — holding the graduated slot — the gate runs REAL instead of the
  # exit-2 NEUTRAL it takes on a slot-less cloud host), else the free GitHub-
  # hosted macos-15 fallback. Ghost-offline (or a fork PR) therefore NEVER wedges
  # this gate — it just falls back to macos-15. Mirrors the linux picker in
  # nobaseline-gate.yml 1:1 (tool/ci_pick_runner.sh · .github/actions/pick-runner).
  dispatch:
    name: dispatch (pick runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      darwin_label: ${{ steps.darwin.outputs.label }}
    steps:
      - uses: actions/checkout@v6
      - id: darwin
        uses: ./.github/actions/pick-runner
        with:
          kind: darwin
          # self-hosted only for same-repo events; fork PRs → GitHub-hosted (RCE).
          eligible: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          # administration:read PAT (self-hosted runners list needs it; the
          # default github.token CANNOT carry that scope → empty list → blind
          # fallback). Absent secret → `|| github.token` = today's harmless
          # macos-15 fallback; present → routing goes live. See PR/root-cause.
          token: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}

  selfhost-native-build-gate:
    name: selfhost native build (gen3 --emit=obj + hexa_ld, darwin-arm64)
    needs: dispatch
    runs-on: ${{ fromJSON(needs.dispatch.outputs.darwin_label) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The gate self-classifies: without a promoted self-host slot
      # ($HOME/.hx/self/native/selfhost/{gen3,hexa_ld,rt.o}) it exits 2 → neutral.
      # A self-hosted runner that holds the slot runs the corpus for real.
      - name: Gate — hexa build native path corpus
        shell: bash
        run: |
          # NB: the Actions shell injects `-e` (errexit), so a non-zero gate
          # exit would abort BEFORE the remap. Capture via `|| rc=$?` so the
          # exit-2-neutral classification actually runs.
          rc=0
          bash tool/selfhost_native_build_gate || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::notice::native-build gate NEUTRAL — no promoted self-host slot on this runner"
            exit 0
          fi
          exit "$rc"
